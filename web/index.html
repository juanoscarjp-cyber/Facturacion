<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturación RD</title>
<meta name="description" content="Facturación con NCF, ITBIS y comprobantes fiscales electrónicos (e-CF) de la DGII.">
<meta name="theme-color" content="#1f1b4d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Facturación">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f6f6f8; --card:#fff; --border:#e6e7eb; --border2:#d6d8de; --text:#14151a; --muted:#6b7080; --soft:#f2f3f6;
  --primary:#1f1b4d; --primary-h:#2d2870; --accent:#e11d48;
  --green:#15803d; --green-bg:#e8f5ec; --blue:#1d4ed8; --blue-bg:#e8eefc; --amber:#b45309; --amber-bg:#fdf3e1;
  --red:#b91c1c; --red-bg:#fdecec; --gray:#555b66; --gray-bg:#eef0f3; --purple:#6d28d9; --purple-bg:#f1ebfd;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
/* Sidebar */
#sidebar{width:240px;flex:0 0 240px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
.emp-switch{margin:0 12px 10px;position:relative}
.emp-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--soft);cursor:pointer;text-align:left}
.emp-btn:hover,.emp-switch.open .emp-btn{border-color:var(--border2);background:#fff}
.emp-btn .chev{width:16px;height:16px;color:var(--muted);flex:0 0 auto;transition:transform .15s}
.emp-switch.open .emp-btn .chev{transform:rotate(180deg)}
.emp-av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:0 0 auto}
.emp-txt{flex:1;min-width:0;line-height:1.25}
.emp-txt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-txt small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-menu{position:absolute;left:0;right:-40px;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);padding:6px;z-index:30;display:none;max-height:60vh;overflow:auto}
.emp-switch.open .emp-menu{display:block}
.emp-menu .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px 4px}
.emp-opt{width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.emp-opt:hover{background:var(--soft)}
.emp-opt .emp-txt b{white-space:normal}
.emp-opt.on{background:var(--blue-bg)}
.emp-opt .ok{width:16px;height:16px;color:var(--primary);flex:0 0 auto}
.emp-new{border-top:1px solid var(--border);margin-top:4px;padding-top:4px}
.emp-new .emp-opt{color:var(--primary);font-weight:600}
.emp-new .emp-av{background:var(--soft);color:var(--primary);border:1px dashed var(--border2)}
nav{padding:4px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#3a3f4b;font-weight:500}
nav a:hover{background:var(--soft)}
nav a.active{background:var(--primary);color:#fff}
nav a svg{width:18px;height:18px;flex:0 0 auto}
.side-foot{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar .crumbs{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumbs b{color:var(--text);font-weight:600}
.btn.menu-btn{display:none}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:12px}
#view{padding:24px;max-width:1240px;width:100%;margin:0 auto}
/* Common */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:26px;margin:0;letter-spacing:-.02em;flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-head h1 .mono{font-family:var(--mono);font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--border2);background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--red);border-color:#f2c4c4}
.btn.danger:hover{background:var(--red-bg)}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}.right{text-align:right}.nowrap{white-space:nowrap}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border2);border-radius:12px;background:#fff;outline:none}
.search input:focus{border-color:var(--primary)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.chip-select{display:flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:12px;background:#fff;padding:0 10px}
.chip-select span{color:var(--muted);font-size:13px;white-space:nowrap}
.chip-select>svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.chip-select select,.chip-select input{border:0;background:transparent;padding:10px 2px;font-weight:600;outline:none;cursor:pointer}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:11px 14px;background:#fafafb;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fafafc}
.tbl-wrap{overflow-x:auto}
.table-foot{padding:12px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sub{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.green{color:var(--green);background:var(--green-bg)}.pill.blue{color:var(--blue);background:var(--blue-bg)}
.pill.amber{color:var(--amber);background:var(--amber-bg)}.pill.red{color:var(--red);background:var(--red-bg)}
.pill.gray{color:var(--gray);background:var(--gray-bg)}.pill.purple{color:var(--purple);background:var(--purple-bg)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--soft);font-size:11px;font-weight:600;color:#3a3f4b;font-family:var(--mono)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* Dashboard */
.db-top{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.db-left{display:flex;flex-direction:column;gap:16px;min-width:0}
.db-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.db-head{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.db-head b{display:block;font-size:15px}.db-head small{color:var(--muted);font-size:12px}
.db-kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.db-kpi{padding:18px 20px;border-right:1px solid var(--border);min-width:0}
.db-kpi:last-child{border-right:0}
.db-kpi .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#3a3f4b;display:flex;align-items:center;gap:6px}
.db-kpi .l i{width:7px;height:7px;border-radius:50%;display:inline-block}
.db-kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;margin:8px 0 4px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-kpi .d{font-size:12px;color:var(--muted)}
.db-res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--border)}
.db-res b{font-size:13px;flex:1;min-width:160px}
.db-res .eq{font-family:var(--mono);font-size:13px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.db-res .eq .tot{font-size:24px;font-weight:600}
.db-bar{margin:20px 20px 14px;height:34px;border-radius:9px;background:#c9c6dc;overflow:hidden;display:flex}
.db-bar div{background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding:0 10px;white-space:nowrap;min-width:0}
.db-chips{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px;padding:0 20px 20px}
.db-chips div{background:var(--soft);border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#4a4f5c}
.db-chips b{font-family:var(--mono);color:var(--text);white-space:nowrap}
.db-deuda{background:#fefbea;border:1px solid #f4dd87;border-radius:16px;padding:20px}
.db-deuda .l{font-size:11px;font-weight:700;letter-spacing:.05em;color:#b45309}
.db-deuda .v{font-family:var(--mono);font-size:30px;font-weight:700;color:#c2410c;margin:6px 0 2px;letter-spacing:-.03em}
.db-deuda .d{font-size:12px;color:#b45309;padding-bottom:16px;border-bottom:1px solid #f1e3a8}
.db-deuda .l2{font-size:11px;font-weight:700;letter-spacing:.05em;color:#b45309;margin:16px 0 8px}
.db-old{display:flex;justify-content:space-between;gap:8px;background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.db-old:hover{box-shadow:0 0 0 1px #f4dd87}
.db-old .n{font-family:var(--mono);font-size:12px;font-weight:600}
.db-old .c{font-size:11px;color:#c2410c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.db-old .r{text-align:right;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
.db-old .r small{display:block;color:var(--red);font-size:11px}
.db-deuda .btn{width:100%;margin-top:10px;background:#fff;color:#c2410c;border-color:#f4dd87}
.db-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}
.db-stats .db-kpi .v{font-family:inherit;font-size:22px;margin:6px 0 2px}
@media (max-width:1100px){.db-top{grid-template-columns:1fr}}
@media (max-width:760px){.db-kpis,.db-stats{grid-template-columns:1fr 1fr}.db-kpi:nth-child(2n){border-right:0}.db-kpi:nth-child(-n+2){border-bottom:1px solid var(--border)}.db-chips{grid-template-columns:1fr}.db-kpi .v{font-size:21px}}
/* KPI */
.kpi{padding:16px 18px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
/* Detail */
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.totals{margin-left:auto;width:min(360px,100%);padding:14px 18px}
.totals .row{display:flex;justify-content:space-between;padding:4px 0}
.totals .row.big{font-size:17px;font-weight:700;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.totals .row.due{color:var(--red);font-weight:700}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:#3a3f4b}
.field .hint{font-size:11px;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:9px;background:#fff;outline:none;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,27,77,.08)}
input.in:disabled,select.in:disabled{background:var(--soft);color:var(--muted)}
textarea.in{resize:vertical;min-height:70px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.items-tbl td{padding:6px 6px;border-bottom:1px solid var(--border)}
.items-tbl th{padding:9px 6px}
.items-tbl input.in,.items-tbl select.in{padding:7px 8px}
.items-tbl .num{text-align:right}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:6px;border-radius:7px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--red-bg);color:var(--red)}
.icon-btn svg{width:16px;height:16px}
.form-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.sticky{position:sticky;top:72px}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--amber-bg);color:#7a3f06}.alert.err{background:var(--red-bg);color:#7f1515}.alert.info{background:var(--blue-bg);color:#1e3a8a}
.section-title{font-size:13px;font-weight:700;margin:18px 0 10px;color:#3a3f4b}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,17,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column}
.modal.wide{width:min(880px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center}
.modal-h span{flex:1}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1b1d24;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.error{background:var(--red)}.toast.ok{background:var(--green)}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--primary)}.chart .bar2{fill:#c9c6ef}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* Empresa cards */
.emp-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.emp-card .top{display:flex;gap:12px;align-items:center}
.emp-card img,.emp-logo{width:46px;height:46px;border-radius:10px;object-fit:contain;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.seq-tbl input.in{padding:6px 8px}
.seq-tbl td,.seq-tbl th{padding:6px 6px}
.onboard{max-width:620px;margin:40px auto;text-align:center}
.onboard .logo{width:56px;height:56px;font-size:28px;border-radius:14px;margin:0 auto 16px}
.onboard h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
.onboard p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Auth */
body.auth-mode #sidebar, body.auth-mode .topbar{display:none}
.auth-wrap{min-height:calc(100vh - 48px);display:grid;place-items:center}
.auth-card{width:min(400px,100%);padding:28px}
.auth-card .logo{margin:0 auto 14px;width:48px;height:48px;font-size:24px;border-radius:12px}
.auth-card h1{text-align:center;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.auth-card p.sub2{text-align:center;color:var(--muted);margin:0 0 20px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.linkish{background:none;border:0;color:var(--primary);cursor:pointer;text-decoration:underline;padding:0;font-size:13px}
.avatar{cursor:pointer;border:0}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:none;place-items:center;font-weight:600}
#busy.on{display:grid}
.spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
/* Responsive */
@media (max-width:980px){
  .form-layout{grid-template-columns:1fr}
  .sticky{position:static}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr}
}
@media (max-width:860px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  body.nav-open #sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .btn.menu-btn{display:inline-flex}
  #view{padding:16px}
  .topbar{padding:0 16px}
  .g2{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr} .page-head h1{font-size:22px} }

/* ===== Print ===== */
#print-area{display:none}
@media print{
  body{background:#fff}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important;color:#000;font-size:12px}
}
.p-doc{font-family:Arial,Helvetica,sans-serif;color:#111}
.p-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px}

<script>
'use strict';
/* =========================================================
   Facturación RD — app de facturación con NCF (DGII)
   Todo en un archivo, datos en localStorage.
   ========================================================= */
const KEY = 'facturacion_rd_v1';
const A = window.A = {};

const NCF_TIPOS = {
  B01: { nombre: 'Crédito Fiscal', titulo: 'FACTURA DE CRÉDITO FISCAL', requiereRNC: true },
  B02: { nombre: 'Consumo', titulo: 'FACTURA DE CONSUMO' },
  B14: { nombre: 'Régimen Especial', titulo: 'FACTURA DE RÉGIMEN ESPECIAL', requiereRNC: true },
  B15: { nombre: 'Gubernamental', titulo: 'FACTURA GUBERNAMENTAL', requiereRNC: true },
  B04: { nombre: 'Nota de Crédito', titulo: 'NOTA DE CRÉDITO' },
  E31: { nombre: 'Crédito Fiscal Electrónica', titulo: 'FACTURA DE CRÉDITO FISCAL ELECTRÓNICA', requiereRNC: true, ecf: true },
  E32: { nombre: 'Consumo Electrónica', titulo: 'FACTURA DE CONSUMO ELECTRÓNICA', ecf: true },
  E34: { nombre: 'Nota de Crédito Electrónica', titulo: 'NOTA DE CRÉDITO ELECTRÓNICA', ecf: true },
  E44: { nombre: 'Régimen Especial Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO PARA REGÍMENES ESPECIALES', requiereRNC: true, ecf: true },
  E45: { nombre: 'Gubernamental Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO GUBERNAMENTAL', requiereRNC: true, ecf: true },
  E33: { nombre: 'Nota de Débito Electrónica', titulo: 'NOTA DE DÉBITO ELECTRÓNICA', ecf: true },
  E41: { nombre: 'Compras Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO DE COMPRAS', requiereRNC: true, ecf: true, egreso: true },
  E43: { nombre: 'Gastos Menores Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO PARA GASTOS MENORES', ecf: true, egreso: true },
  E46: { nombre: 'Exportaciones Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO PARA EXPORTACIONES', ecf: true },
  E47: { nombre: 'Pagos al Exterior Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO PARA PAGOS AL EXTERIOR', ecf: true, egreso: true },
};
const TIPOS_FACTURA = ['B02', 'B01', 'B14', 'B15', 'E31', 'E32', 'E44', 'E45', 'E46', 'E41', 'E43', 'E47'];
const esECF = t => /^E\d\d$/.test(t || '');
const esNota = t => t === 'B04' || t === 'E34';
// Comprobantes que se emiten al comprar o pagar (no son ventas): no suman en ventas ni en cuentas por cobrar.
const esEgreso = t => !!NCF_TIPOS[t]?.egreso;
// Comprobantes que hacen referencia a otro (notas de crédito y débito)
const esRef = t => esNota(t) || t === 'E33';
const SIN_VENCE = ['E32', 'E34'];
const LIMITE_RFCE = 250000;
const TIPO_NONE = 'NONE';
const nombreTipo = t => t === TIPO_NONE ? 'Sin comprobante' : (NCF_TIPOS[t] ? NCF_TIPOS[t].nombre : t);
const METODOS = ['Efectivo', 'Tarjeta', 'Transferencia', 'Cheque', 'Otro'];
const ITBIS_TASAS = [18, 16, 0];
const MOTIVOS_ANULACION = {
  '01': 'Deterioro de factura pre-imprenta', '02': 'Errores de impresión (factura pre-imprenta)',
  '03': 'Impresión defectuosa', '04': 'Corrección de la información', '05': 'Cambio de productos',
  '06': 'Devolución de productos', '07': 'Omisión de productos', '08': 'Errores en secuencia de NCF',
  '09': 'Por cese de operaciones', '10': 'Pérdida o hurto de talonarios',
};
const ESTADOS = {
  emitida: ['Emitida', 'blue'], pagada: ['Pagada', 'green'], parcial: ['Pago parcial', 'amber'],
  vencida: ['Vencida', 'red'], anulada: ['Anulada', 'gray'], nota: ['Nota de crédito', 'purple'],
  egreso: ['Compra / gasto', 'purple'], borrador: ['Borrador', 'gray'],
};
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

/* ---------- Supabase ---------- */
const SUPABASE_URL = 'https://gwvqpnmwqvqrmsbpwmhj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JG_uubMg9brkjoIz7x-Xmw_uCyvz3F6'; // clave pública (publishable); la seguridad la dan las políticas RLS
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let SESSION = null;
let BOOTING = true;

function blankDB() { return { version: 1, empresas: [], activeId: null, clientes: [], productos: [], facturas: [], gastos: [] }; }
let DB = blankDB();   // caché en memoria de la empresa activa
function localBackup() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.empresas) && d.empresas.length) return d; } catch (e) { }
  return null;
}
const activeKey = () => 'fact_active_' + (SESSION?.user?.id || '');

function errMsg(err) {
  const m = String(err?.message || err || 'Error desconocido');
  if (/Invalid login credentials/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Debes confirmar tu email. Revisa tu bandeja de entrada.';
  if (/User already registered/i.test(m)) return 'Ya existe una cuenta con ese email. Inicia sesión.';
  if (/Password should be at least/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/facturas_empresa_numero_key/.test(m)) return 'Ya existe una factura con ese número. Ajusta el "Próximo número" en Empresas.';
  if (/facturas_empresa_ncf_key/.test(m)) return 'Ese NCF ya fue usado. Revisa el "Último usado" de la secuencia en Empresas.';
  if (/secuencias_tipo_check/.test(m)) return 'Falta ejecutar supabase/ecf3.sql en Supabase (tipos e-CF nuevos).';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor. Revisa tu internet.';
  if (/relation .* does not exist|Could not find the (table|function)/i.test(m)) return 'La base de datos no está configurada. Ejecuta supabase/schema.sql en Supabase.';
  return m;
}
const chk = ({ data, error }) => { if (error) throw error; return data; };
function busy(on, txt = 'Cargando…') { $('#busy-txt').textContent = txt; $('#busy').classList.toggle('on', !!on); }

/* mapeo filas <-> objetos de la app */
function fromEmpresaRow(r, seqs, rol) {
  const secuencias = {};
  (seqs || []).filter(s => s.empresa_id === r.id).forEach(s => {
    secuencias[s.tipo] = { activo: s.activo, desde: Number(s.desde), hasta: s.hasta == null ? '' : Number(s.hasta), actual: Number(s.actual), vence: s.vence || '' };
  });
  return { ...(r.data || {}), id: r.id, nombre: r.nombre, proximoNumero: r.proximo_numero, proximoNC: r.proximo_nc, rol: rol || 'usuario', secuencias };
}
function empresaData(e) { const { id, nombre, proximoNumero, proximoNC, secuencias, rol, ...rest } = e; return rest; }
const stripIds = o => { const { id, empresaId, ...rest } = o; return rest; };
const fromRow = r => ({ ...(r.data || {}), id: r.id, empresaId: r.empresa_id });
const fromFacturaRow = r => ({ pagos: [], items: [], ...(r.data || {}), id: r.id, empresaId: r.empresa_id, numero: r.numero, tipo: r.tipo, ncf: r.ncf || '', _v: r.updated_at });
const facturaData = f => { const { id, empresaId, _v, _edit, ...rest } = f; return rest; };
const seqRow = (empresaId, t, s = {}) => ({ empresa_id: empresaId, tipo: t, activo: !!s.activo, desde: num(s.desde) || 1, hasta: s.hasta === '' || s.hasta == null ? null : num(s.hasta), actual: num(s.actual), vence: s.vence || null });
function seqRows(empresaId, secuencias) {
  return Object.keys(NCF_TIPOS).map(t => seqRow(empresaId, t, secuencias[t]));
}
function putCache(list, obj) {
  const arr = DB[list], i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
}

async function fetchAll(table, empresaId) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const data = chk(await sb.from(table).select('*').eq('empresa_id', empresaId).range(from, from + 999));
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
async function loadEmpresas() {
  const [es, ms, ss] = await Promise.all([
    sb.from('empresas').select('*').order('created_at'),
    sb.from('miembros').select('empresa_id,rol').eq('user_id', SESSION.user.id),
    sb.from('secuencias').select('*'),
  ]).then(rs => rs.map(chk));
  DB.empresas = es.map(r => fromEmpresaRow(r, ss, (ms.find(m => m.empresa_id === r.id) || {}).rol));
}
async function reloadEmpresa(id) {
  const [r, ss] = await Promise.all([sb.from('empresas').select('*').eq('id', id).single(), sb.from('secuencias').select('*').eq('empresa_id', id)]).then(rs => rs.map(chk));
  const old = DB.empresas.find(e => e.id === id);
  const ne = fromEmpresaRow(r, ss, old?.rol);
  const i = DB.empresas.findIndex(e => e.id === id);
  if (i >= 0) DB.empresas[i] = ne; else DB.empresas.push(ne);
}
async function loadEmpresaData(id) {
  // gastos: si aún no se ejecutó supabase/ecf6.sql la tabla no existe; el resto de la app sigue funcionando
  const [cs, ps, fs, gs] = await Promise.all([fetchAll('clientes', id), fetchAll('productos', id), fetchAll('facturas', id),
    fetchAll('gastos', id).then(r => { DB.sinGastos = false; return r; }, () => { DB.sinGastos = true; return []; })]);
  DB.clientes = cs.map(fromRow);
  DB.productos = ps.map(fromRow);
  DB.facturas = fs.map(fromFacturaRow);
  DB.gastos = gs.map(fromRow);
}
async function activarEmpresa(id) {
  DB.activeId = id;
  DB.clientes = []; DB.productos = []; DB.facturas = []; DB.gastos = [];
  try { localStorage.setItem(activeKey(), id || ''); } catch (e) { }
  if (id) await loadEmpresaData(id);
  subscribe();
}
// Lee la última versión, aplica cambios y guarda solo si nadie la modificó entretanto.
async function mutateFactura(id, fn) {
  for (let i = 0; i < 3; i++) {
    const row = chk(await sb.from('facturas').select('*').eq('id', id).single());
    const f = fromFacturaRow(row);
    fn(f);
    const upd = chk(await sb.from('facturas').update({ data: facturaData(f), fecha: f.fecha }).eq('id', id).eq('updated_at', row.updated_at).select());
    if (upd.length) { const nf = fromFacturaRow(upd[0]); putCache('facturas', nf); return nf; }
  }
  throw new Error('Otro usuario modificó esta factura al mismo tiempo. Intenta de nuevo.');
}

/* ---------- Tiempo real ---------- */
let channel = null, rtTimer = null;
function subscribe() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  const id = DB.activeId; if (!id) return;
  const f = `empresa_id=eq.${id}`;
  channel = sb.channel('emp-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'facturas', filter: f }, p => rtRow('facturas', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clientes', filter: f }, p => rtRow('clientes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'productos', filter: f }, p => rtRow('productos', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gastos', filter: f }, p => rtRow('gastos', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'secuencias', filter: f }, () => rtEmpresa())
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'empresas', filter: `id=eq.${id}` }, () => rtEmpresa())
    .subscribe();
}
function rtRow(list, p) {
  if (p.eventType === 'DELETE') { DB[list] = DB[list].filter(x => x.id !== p.old.id); }
  else if (p.new.empresa_id === DB.activeId) putCache(list, list === 'facturas' ? fromFacturaRow(p.new) : fromRow(p.new));
  rerenderSoon();
}
async function rtEmpresa() { try { await reloadEmpresa(DB.activeId); rerenderSoon(); } catch (e) { } }
function rerenderSoon() {
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    const { parts } = parseHash();
    const enForm = parts[0] === 'facturas' && (parts[1] === 'nueva' || parts[2] === 'editar');
    const escribiendo = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ($('#modal-root').innerHTML || escribiendo) return;
    if (enForm) { if (draft) A.refreshTotals(); return; }
    route(true);
  }, 400);
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const money = n => 'RD$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyShort = n => { n = Number(n) || 0; const a = Math.abs(n); if (a >= 1e6) return 'RD$' + (n / 1e6).toFixed(1) + 'M'; if (a >= 1e3) return 'RD$' + (n / 1e3).toFixed(1) + 'K'; return 'RD$' + n.toFixed(0); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const fdate = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${+d} ${MESES[+m - 1]} ${y}`; };
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + Number(n)); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = (n, l = 4) => String(n).padStart(l, '0');
const digits = v => String(v || '').replace(/\D/g, '');
const validId = v => [9, 11].includes(digits(v).length);
function fmtId(v) {
  const d = digits(v);
  if (d.length === 9) return d.slice(0, 3) + '-' + d.slice(3, 8) + '-' + d.slice(8);
  if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 10) + '-' + d.slice(10);
  return v || '';
}
const initials = s => String(s || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '—';

const ICONS = {
  dash: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  inv: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/>',
  chart: '<path d="M18 20V10M12 20V4M6 20v-6"/>',
  building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  print: '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',

const emp = () => DB.empresas.find(e => e.id === DB.activeId) || null;
const clientes = () => DB.clientes.filter(c => c.empresaId === DB.activeId).sort((a, b) => a.nombre.localeCompare(b.nombre));
const productos = () => DB.productos.filter(p => p.empresaId === DB.activeId).sort((a, b) => a.descripcion.localeCompare(b.descripcion));
const facturas = () => DB.facturas.filter(f => f.empresaId === DB.activeId);
const getC = id => DB.clientes.find(c => c.id === id);
const getP = id => DB.productos.find(p => p.id === id);
const getF = id => DB.facturas.find(f => f.id === id);

function calc(f) {
  let bruto = 0, desc = 0, itbis = 0, gravado = 0, exento = 0;
  for (const it of f.items || []) {
    const b = r2(num(it.cantidad) * num(it.precio));
    const d = r2(b * num(it.descuento) / 100);
    const base = r2(b - d);
    const tax = r2(base * num(it.itbis) / 100);
    bruto += b; desc += d; itbis += tax;
    if (num(it.itbis) > 0) gravado += base; else exento += base;
  }
  const base = r2(bruto - desc);
  const propina = f.propina ? r2(base * 0.10) : 0;
  return { bruto: r2(bruto), descuento: r2(desc), base, itbis: r2(itbis), propina, total: r2(base + itbis + propina), gravado: r2(gravado), exento: r2(exento) };
}
// Lo que salda cada pago: dinero recibido + lo que el cliente retuvo (ITBIS/ISR) y paga a la DGII por ti.
const retPago = p => r2(num(p.retItbis) + num(p.retIsr));
const pagado = f => r2((f.pagos || []).reduce((s, p) => s + num(p.monto) + retPago(p), 0));
const retenidoCliente = f => (f.pagos || []).reduce((a, p) => ({ itbis: r2(a.itbis + num(p.retItbis)), isr: r2(a.isr + num(p.retIsr)) }), { itbis: 0, isr: 0 });
const esBorrador = f => f.estado === 'borrador';
const notasDe = f => DB.facturas.filter(n => esNota(n.tipo) && n.facturaAfectadaId === f.id && n.estado !== 'anulada' && !esBorrador(n));
const totalNotas = f => r2(notasDe(f).reduce((s, n) => s + calc(n).total, 0));
function saldo(f) {
  if (f.estado === 'anulada' || esBorrador(f) || esNota(f.tipo) || esEgreso(f.tipo)) return 0;
  return Math.max(0, r2(calc(f).total - pagado(f) - totalNotas(f)));
}
function estado(f) {
  if (f.estado === 'anulada') return 'anulada';
  if (esBorrador(f)) return 'borrador';
  if (esNota(f.tipo)) return 'nota';
  if (esEgreso(f.tipo)) return 'egreso';
  if (saldo(f) <= 0.004) return 'pagada';
  if (pagado(f) > 0 || notasDe(f).length) return 'parcial';
  if (f.vencimiento && f.vencimiento < today()) return 'vencida';
  return 'emitida';
}
const pill = st => `<span class="pill ${ESTADOS[st][1]}">${ESTADOS[st][0]}</span>`;
// Notas de crédito restan; compras y gastos (E41/E43/E47) no cuentan como ventas.
const signo = f => esEgreso(f.tipo) ? 0 : esNota(f.tipo) ? -1 : 1;
// Los borradores no son comprobantes: no cuentan en reportes, dashboard ni cuentas por cobrar
const vigente = f => f.estado !== 'anulada' && f.estado !== 'borrador';

function seqInfo(e, tipo) {
  const s = e.secuencias && e.secuencias[tipo];
  if (!s || !s.activo) return null;
  const usadas = Math.max(0, num(s.actual) - num(s.desde) + 1);
  const restantes = s.hasta ? Math.max(0, num(s.hasta) - Math.max(num(s.actual), num(s.desde) - 1)) : Infinity;
  return { ...s, usadas, restantes, vencida: s.vence && s.vence < today() };
}

const DB_PERIODOS = { mes: 'Este mes', mesant: 'Mes anterior', tri: 'Últimos 3 meses', anio: 'Este año', anioant: 'Año anterior', todo: 'Todo' };
let DBP = 'mes';
function rangoPeriodo(p) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  if (p === 'mesant') return [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))];
  if (p === 'tri') return [iso(new Date(y, m - 2, 1)), today()];
  if (p === 'anio') return [`${y}-01-01`, `${y}-12-31`];
  if (p === 'anioant') return [`${y - 1}-01-01`, `${y - 1}-12-31`];

function barChart(serie) {

  const max = Math.max(1, ...serie.map(s => Math.max(s.fact, s.cob)));
  const step = (W - P.l - P.r) / serie.length, bw = Math.min(16, step / 3);
  const y = val => P.t + (H - P.t - P.b) * (1 - Math.max(0, val) / max);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const val = max * i / 4, yy = y(val);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="#eceef2"/><text x="${P.l - 6}" y="${yy + 4}" text-anchor="end">${moneyShort(val).replace('RD$', '')}</text>`;
  }
  serie.forEach((s, i) => {
    const cx = P.l + step * i + step / 2;
    g += `<rect class="bar" x="${cx - bw - 1}" y="${y(s.fact)}" width="${bw}" height="${H - P.b - y(s.fact)}" rx="3"><title>${MESES[+s.m.slice(5) - 1]} ${s.m.slice(0, 4)} · Facturado ${money(s.fact)}</title></rect>`;
    g += `<rect class="bar2" x="${cx + 1}" y="${y(s.cob)}" width="${bw}" height="${H - P.b - y(s.cob)}" rx="3"><title>Cobrado ${money(s.cob)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MESES[+s.m.slice(5) - 1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes">${g}</svg>`;
}

function filtrarFacturas() {

    if (LF.tipo === 'ventas' && (esNota(f.tipo) || esEgreso(f.tipo))) return false;
    if (LF.tipo === 'egresos' && !esEgreso(f.tipo)) return false;
    if (LF.tipo && !['ventas', 'egresos'].includes(LF.tipo) && f.tipo !== LF.tipo) return false;
    if (LF.desde && f.fecha < LF.desde) return false;
    if (LF.hasta && f.fecha > LF.hasta) return false;

    if (q) {

      const hay = [f.numero, f.ncf, c.nombre || 'consumidor final'].join(' ').toLowerCase();

A.pagoRet = (form, cambio) => {
  if (!form) return;
  const c = PAGO_CTX, el = n => form.elements[n];
  const aplicarPct = (sel, inp, total, ya) => {
    const v = el(sel).value;
    if (v === 'otro') { el(inp).readOnly = false; if (cambio) el(inp).focus(); }
    else { el(inp).readOnly = true; el(inp).value = Math.max(0, r2(total * num(v) / 100 - ya)).toFixed(2); }
  };
  if (!el('retItbis').disabled) aplicarPct('pctItbis', 'retItbis', c.itbis, c.prev.itbis);
  aplicarPct('pctIsr', 'retIsr', c.base, c.prev.isr);
  const ret = r2(num(el('retItbis').value) + num(el('retIsr').value));
  if (cambio || !c.manual) el('monto').value = Math.max(0, r2(c.sal - ret)).toFixed(2);
  if (cambio) c.manual = false;
  const queda = r2(c.sal - ret - num(el('monto').value));
  $('#pago-resumen').innerHTML = `Recibido ${money(num(el('monto').value))} + retenciones ${money(ret)} = <b>${money(r2(num(el('monto').value) + ret))}</b>${queda > 0.004 ? ` · Quedará pendiente ${money(queda)}` : queda < -0.004 ? ` · <span style="color:var(--red)">Excede el saldo por ${money(-queda)}</span>` : ' · Factura saldada'}`;
};

/* ---------- Importar e-CF (XML) emitidos en el Facturador Gratuito de la DGII u otro sistema ---------- */
const xtx = (el, tag) => { const n = el && el.getElementsByTagNameNS('*', tag)[0]; return n ? n.textContent.trim() : ''; };
const fechaISO = s => { const m = /^(\d{2})-(\d{2})-(\d{4})/.exec(s || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
const TASA_IND = { 1: 18, 2: 16, 3: 0, 4: 0 };
const METODO_FORMA = { 1: 'Efectivo', 2: 'Transferencia', 3: 'Tarjeta' };
function leerECF(nombre, texto) {
  const doc = new DOMParser().parseFromString(texto.replace(/^﻿/, ''), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('no es un XML válido');
  const raiz = doc.documentElement.localName;
  if (raiz === 'RFCE') throw new Error('es un resumen (RFCE); sube el XML completo del e-CF');
  if (raiz !== 'ECF') throw new Error(`no es un e-CF (es ${raiz})`);
  const tipo = 'E' + xtx(doc, 'TipoeCF'), encf = xtx(doc, 'eNCF').toUpperCase();
  if (!NCF_TIPOS[tipo] || !/^E\d{12}$/.test(encf)) throw new Error('tipo o e-NCF inválido');
  const fecha = fechaISO(xtx(doc, 'FechaEmision'));
  if (!fecha) throw new Error('sin fecha de emisión');
  const incluyeItbis = xtx(doc, 'IndicadorMontoGravado') === '1';
  const items = [...doc.getElementsByTagNameNS('*', 'Item')].map(it => {
    const tasa = TASA_IND[+xtx(it, 'IndicadorFacturacion')] ?? 0, k = incluyeItbis && tasa ? 1 + tasa / 100 : 1;
    const cantidad = num(xtx(it, 'CantidadItem')) || 1, precio = num(xtx(it, 'PrecioUnitarioItem')) / k;
    const descM = num(xtx(it, 'DescuentoMonto')) / k, bruto = cantidad * precio;
    const desc = xtx(it, 'DescripcionItem');
    return { id: uid(), descripcion: xtx(it, 'NombreItem') + (desc ? ' — ' + desc : ''), sku: xtx(it, 'CodigoItem'), cantidad,
      precio: Math.round(precio * 10000) / 10000, descuento: bruto ? Math.round(descM / bruto * 1e6) / 1e4 : 0, itbis: tasa };
  });
  if (!items.length) throw new Error('no tiene ítems');
  const montoTxt = xtx(doc, 'MontoTotal'), montoTotal = num(montoTxt);
  const tipoPago = xtx(doc, 'TipoPago'), credito = tipoPago === '2';
  const formas = [...doc.getElementsByTagNameNS('*', 'FormaDePago')].map(fp => ({ forma: +xtx(fp, 'FormaPago'), monto: num(xtx(fp, 'MontoPago')) })).filter(p => p.monto > 0 && p.forma !== 4);
  const firma = xtx(doc, 'SignatureValue').replace(/\s/g, '');
  return {
    archivo: nombre, tipo, encf, fecha, montoTotal, montoTxt, credito, formas, items,
    rncEmisor: digits(xtx(doc, 'RNCEmisor')), fechaEmisionTxt: xtx(doc, 'FechaEmision'),
    vence: fechaISO(xtx(doc, 'FechaVencimientoSecuencia')), limitePago: fechaISO(xtx(doc, 'FechaLimitePago')),
    comprador: { rnc: digits(xtx(doc, 'RNCComprador')), idExtranjero: xtx(doc, 'IdentificadorExtranjero'), nombre: xtx(doc, 'RazonSocialComprador'), direccion: xtx(doc, 'DireccionComprador'), email: xtx(doc, 'CorreoComprador') },
    ncfModificado: xtx(doc, 'NCFModificado').toUpperCase(),
    codigoSeguridad: firma.slice(0, 6), fechaFirma: xtx(doc, 'FechaHoraFirma'), xml: texto,
  };
}
function qrTimbre(d) {

A.importarGuardar = async () => {
  const lista = IMPORT.filter(d => !d.error);
  if (!lista.length) { toast('Elige archivos XML válidos para importar.', 'error'); return false; }
  const e = emp();
  // Primero facturas, luego notas (para enlazarlas con la factura que modifican)
  lista.sort((a, b) => (esRef(a.tipo) - esRef(b.tipo)) || a.encf.localeCompare(b.encf));
  busy(true, `Importando ${lista.length} comprobantes…`);
  let n = 0; const fallos = [];
  try {
    for (const d of lista) {
      try {
        let cli = null;
        const c = d.comprador;
        if (c.rnc || c.idExtranjero) {
          cli = clientes().find(x => (c.rnc && digits(x.rnc) === c.rnc) || (c.idExtranjero && x.idExtranjero === c.idExtranjero));
          if (!cli) {
            cli = { id: uid(), empresaId: e.id, nombre: c.nombre || c.rnc || c.idExtranjero, rnc: c.rnc, idExtranjero: c.rnc ? '' : c.idExtranjero, direccion: c.direccion, telefono: '', email: c.email, creado: new Date().toISOString() };
            chk(await sb.from('clientes').upsert({ id: cli.id, empresa_id: e.id, data: stripIds(cli) }));
            putCache('clientes', cli);
          }
        }
        const base = { items: d.items };
        const total = calc(base).total;
        const vencimiento = d.credito ? (d.limitePago || d.fecha) : '';
        const pagos = [];
        if (!d.credito && !esRef(d.tipo) && !esEgreso(d.tipo)) {
          (d.formas.length ? d.formas : [{ forma: 1, monto: total }]).forEach(p => pagos.push({ id: uid(), fecha: d.fecha, metodo: METODO_FORMA[p.forma] || 'Otro', monto: r2(p.monto), referencia: '', por: SESSION.user.email }));
          const dif = r2(total - pagos.reduce((s, p) => s + p.monto, 0));
          if (dif) pagos[pagos.length - 1].monto = r2(pagos[pagos.length - 1].monto + dif);
        }
        const afectada = d.ncfModificado ? facturas().find(f => f.ncf === d.ncfModificado) : null;
        const data = {
          clienteId: cli ? cli.id : '',
          cliente: cli ? { nombre: cli.nombre, rnc: cli.rnc, idExtranjero: cli.idExtranjero || '', direccion: cli.direccion, telefono: cli.telefono, email: cli.email } : { nombre: c.nombre || 'Consumidor Final' },
          fecha: d.fecha, condicion: d.credito ? 'credito' : 'contado', diasCredito: d.credito ? Math.max(0, daysBetween(d.fecha, vencimiento)) : 0, vencimiento,
          items: d.items, propina: false, notas: '', facturaAfectadaId: afectada ? afectada.id : '', ncfModificado: d.ncfModificado,
          creada: new Date().toISOString(), creadaPor: SESSION.user.email, pagos, estado: 'emitida',
          numero: d.encf, tipo: d.tipo, ncf: d.encf, ncfVence: d.vence,
          importado: { origen: 'XML', archivo: d.archivo, fecha: new Date().toISOString(), montoTotal: d.montoTotal },
          ecf: { estado: 'Aceptado', ambiente: 'ecf', importado: true, codigoSeguridad: d.codigoSeguridad, fechaFirma: d.fechaFirma, xml: d.xml, qr: qrTimbre(d), rfce: d.tipo === 'E32' && d.montoTotal < LIMITE_RFCE },
        };
        const row = chk(await sb.from('facturas').insert({ empresa_id: e.id, numero: d.encf, tipo: d.tipo, ncf: d.encf, fecha: d.fecha, data }).select().single());
        putCache('facturas', fromFacturaRow(row)); n++;
      } catch (err) { fallos.push(`${d.encf}: ${errMsg(err)}`); }
    }
    // Avanza "Último usado" de las secuencias para que la app no repita esos e-NCF
    const avanzadas = [];
    for (const t of [...new Set(lista.map(d => d.tipo))]) {
      const s = e.secuencias?.[t]; if (!s) continue;
      const usados = lista.filter(d => d.tipo === t).map(d => Number(d.encf.slice(3))).filter(x => x >= num(s.desde) && (!s.hasta || x <= num(s.hasta)));
      const max = Math.max(0, ...usados);
      if (max > num(s.actual)) {
        try { chk(await sb.from('secuencias').update({ actual: max }).eq('empresa_id', e.id).eq('tipo', t).lt('actual', max)); avanzadas.push(`${t} → ${max}`); } catch (err) { fallos.push(`Secuencia ${t}: ${errMsg(err)}`); }
      }
    }
    if (avanzadas.length) await reloadEmpresa(e.id).catch(() => { });
    toast(`${n} comprobantes importados.${avanzadas.length ? ' Secuencias avanzadas: ' + avanzadas.join(', ') + '.' : ''}`, 'ok');
    if (fallos.length) setTimeout(() => modal('Algunos no se importaron', `<div class="alert err"><div>${fallos.map(esc).join('<br>')}</div></div>`, { noFooter: true }), 300);
  } finally { busy(false); route(true); }

const AMBIENTES_ECF = { testecf: 'Pre-certificación (TesteCF)', certecf: 'Certificación (CerteCF)', ecf: 'Producción' };

async function apiECF(ruta, body) {

    r = await fetch('/api/ecf/' + ruta, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify(body) });

function cargarScript(src) {

    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}

        const attr = n => (cert.subject.getField(n) || cert.subject.getField({ name: n }) || {}).value || '';
        const certInfo = {
          cn: attr('CN'), sn: attr('serialNumber'), emisor: (cert.issuer.getField('CN') || cert.issuer.getField('O') || {}).value || '',

          pkcs8: forge.util.encode64(forge.asn1.toDer(forge.pki.wrapRsaPrivateKey(forge.pki.privateKeyToAsn1(key))).getBytes()),

    }

  const row = chk(await sb.rpc('emitir_factura', { p_empresa: e.id, p_tipo: p.tipo, p_data: data }));

async function simProcesar(p) {

  C.sim = C.sim || {};
  const s = C.sim[p.k] = C.sim[p.k] || {};
  try {
    if (!s.facturaId || !getF(s.facturaId)) {
      const f = await simEmitir(p, C.sim);
      Object.assign(s, { facturaId: f.id, ncf: f.ncf, numero: f.numero, error: '' });
      certGuardar();
    }
    const { ecf } = await apiECF('emitir', { facturaId: s.facturaId });
    const f = getF(s.facturaId); if (f) f.ecf = ecf;
    Object.assign(s, { estado: ecf.estado, mensajes: ecf.mensajes || [], rfce: ecf.rfce, error: '' });
  } catch (err) { s.error = errMsg(err); }
  certGuardar();
}

  ['44', 'E44-'], ['45', 'E45-'], ['46', 'E46-'], ['47', 'E47-'], ['32 < RD$250mil', 'E32-3', 'E32-4', 'E32-5', 'E32-6'],

A.simPDFs = async () => {
  const C = certCargar(), sim = C.sim || {};

  const elegir = claves => SIM_PLAN.filter(p => claves.some(c => c.endsWith('-') ? p.k.startsWith(c) : p.k === c)).map(p => sim[p.k]).find(s => okS(s) && getF(s.facturaId)?.ecf?.qr);
  const lista = RI_CAMPOS.map(([campo, ...claves]) => ({ campo, s: elegir(claves) }));
  const faltan = lista.filter(x => !x.s).map(x => x.campo);
  if (faltan.length === lista.length) return toast('No hay comprobantes aceptados de la simulación (Paso 4) en esta empresa.', 'error');
  busy(true, 'Generando representaciones impresas…');
  try {
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const caja = document.createElement('div');
    // Ancho = área imprimible de una hoja carta con márgenes de 10 mm (215.9 − 20 = 195.9 mm ≈ 740 px)
    // En la esquina (0,0) detrás de la página: fuera de pantalla html2canvas recorta mal el contenido.
    caja.style.cssText = 'position:absolute;left:0;top:0;width:740px;z-index:-1;background:#fff;color:#000;font-size:12px;box-sizing:border-box';
    window.scrollTo(0, 0);
    document.body.appendChild(caja);
    let total = 0;
    for (const { campo, s } of lista.filter(x => x.s)) {
      const f = getF(s.facturaId);
      busy(true, `Generando PDF tipo ${campo}…`);
      caja.innerHTML = cartaHTML(f);
      await Promise.all([...caja.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
      const doc = caja.firstElementChild;
      doc.style.width = '740px'; doc.style.boxSizing = 'border-box';
      // Se captura el documento completo y se escala al área imprimible: no depende del ancho de la pantalla.
      const canvas = await html2canvas(doc, { scale: 2, backgroundColor: '#ffffff', width: doc.scrollWidth, height: doc.scrollHeight, windowWidth: Math.max(1200, doc.scrollWidth), scrollX: 0, scrollY: 0 });
      const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'letter', orientation: 'portrait' });
      const margen = 10, anchoUtil = 215.9 - 2 * margen, altoUtil = 279.4 - 2 * margen;
      let w = anchoUtil, h = canvas.height * anchoUtil / canvas.width;
      if (h > altoUtil) { w = w * altoUtil / h; h = altoUtil; }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', margen, margen, w, h);
      const blob = pdf.output('blob');
      total += blob.size;
      const etiqueta = campo.includes('>=') ? '32 (250 mil o mas)' : campo.includes('<') ? '32 (menos de 250 mil)' : campo;
      const nombre = `RI tipo ${etiqueta} - ${f.ncf}.pdf`;
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      await new Promise(r => setTimeout(r, 400));
    }
    caja.remove();
    toast(`${lista.length - faltan.length} PDF generados (${(total / 1048576).toFixed(1)} MB en total).${faltan.length ? ' Faltan tipos: ' + faltan.join(', ') : ''}`, faltan.length ? 'error' : 'ok');

async function certProcesar(f) {

    }

    C.res[f.ENCF] = { ...(C.res[f.ENCF] || {}), error: errMsg(err), estado: (C.res[f.ENCF] || {}).estado };

}

// Neto que el cliente debe pagar después de las retenciones que te hará (dato interno; no va en el e-CF)
function netoCliente(f) {
  const n = f.neto; if (!n || !(num(n.itbis) || num(n.isr)) || esRef(f.tipo) || esEgreso(f.tipo)) return null;
  const t = calc(f), itbis = r2(t.itbis * num(n.itbis) / 100), isr = r2(t.base * num(n.isr) / 100);
  return { pctItbis: num(n.itbis), pctIsr: num(n.isr), itbis, isr, neto: r2(t.total - itbis - isr) };
}
// Lo que el cliente todavía debe pagarte en dinero: el saldo menos las retenciones previstas que aún no se registran en un pago
function porCobrarNeto(f) {
  const sal = saldo(f), n = netoCliente(f); if (!n) return sal;
  const rc = retenidoCliente(f);
  return Math.max(0, r2(sal - Math.max(0, n.itbis - rc.itbis) - Math.max(0, n.isr - rc.isr)));
}

      <div class="field"><label>Clasificación 606</label><select class="in" name="tipo606">${Object.entries(TIPOS_606).map(([k, l]) => `<option value="${k}" ${k === '02' ? 'selected' : ''}>${k} · ${l}</option>`).join('')}</select></div>
    </div>
    <div class="tbl-wrap" style="max-height:320px;overflow:auto"><table><thead><tr><th><input type="checkbox" checked onchange="this.form.querySelectorAll('input[name=rec]').forEach(c=>c.checked=this.checked)"></th><th>Proveedor</th><th>e-NCF</th><th>Fecha</th><th class="right">Total</th></tr></thead><tbody>
    ${REC_IMPORT.map((r, i) => `<tr><td><input type="checkbox" name="rec" value="${i}" checked></td><td>${esc(r.razon_social_emisor || r.rnc_emisor)}<span class="sub">${esc(fmtId(r.rnc_emisor))}</span></td><td class="mono small">${esc(r.encf)}</td><td class="nowrap">${esc(r.fecha_emision || '')}</td><td class="right mono">${money(r.monto_total)}</td></tr>`).join('')}
    </tbody></table></div>`, {
    wide: true, okText: 'Importar seleccionados', onOk: async form => {
      const sel = [...form.querySelectorAll('input[name=rec]:checked')].map(c => REC_IMPORT[+c.value]);
      if (!sel.length) { toast('Selecciona al menos uno.', 'error'); return false; }
      const clase = fv(form, 'clase'), tipo606 = fv(form, 'tipo606');
      busy(true, 'Importando…'); let n = 0;
      try {
        for (const r of sel) {
          const doc = new DOMParser().parseFromString(r.xml || '', 'application/xml');
          let servicios = 0, bienes = 0;
          [...doc.getElementsByTagNameNS('*', 'Item')].forEach(it => { const m = num(xtx(it, 'MontoItem')); if (xtx(it, 'IndicadorBienoServicio') === '2') servicios += m; else bienes += m; });
          const itbis = num(xtx(doc, 'TotalITBIS')) || num(r.total_itbis);
          const total = num(xtx(doc, 'MontoTotal')) || num(r.monto_total);
          // Si el XML trae los precios con ITBIS incluido, la base es el total menos el ITBIS
          const base = r2(total - itbis - num(xtx(doc, 'MontoImpuestoAdicional')));
          if (Math.abs(servicios + bienes - base) > 0.05) { const k = base / ((servicios + bienes) || 1); servicios = servicios ? r2(servicios * k) : 0; bienes = r2(base - servicios); }
          const fecha = fechaISO(xtx(doc, 'FechaEmision') || r.fecha_emision) || today();
          const credito = xtx(doc, 'TipoPago') === '2';
          const data = { creado: new Date().toISOString(), creadoPor: SESSION.user.email, origen: 'e-CF recibido',
            fecha, proveedor: { nombre: r.razon_social_emisor || xtx(doc, 'RazonSocialEmisor') || r.rnc_emisor, rnc: digits(r.rnc_emisor) }, ncf: r.encf, ncfModificado: xtx(doc, 'NCFModificado'),
            clase, tipo606, descripcion: xtx(doc, 'NombreItem'), servicios: r2(servicios), bienes: r2(bienes), itbis: r2(itbis), propina: 0, selectivo: 0,
            otros: r2(num(xtx(doc, 'MontoImpuestoAdicional'))), itbisRetenido: 0, isrTipo: '', isrRetenido: 0,
            formaPago: credito ? '04' : '02', pagado: !credito, fechaPago: credito ? '' : fecha, notas: '' };
          const gid = uid();
          chk(await sb.from('gastos').insert({ id: gid, empresa_id: DB.activeId, fecha, rnc_proveedor: data.proveedor.rnc, ncf: data.ncf, data }));
          putCache('gastos', { ...data, id: gid, empresaId: DB.activeId }); n++;
        }
        toast(`${n} comprobantes importados.`, 'ok');
      } catch (err) { toast(`${n} importados. Error: ${errMsg(err)}`, 'error'); }
      finally { busy(false); route(true); }
    },
  });
};

/* =========================================================
   SECUENCIAS NCF (control de comprobantes autorizados)
   ========================================================= */
// Alerta cuando quedan pocos comprobantes: lo que configure la empresa o, por defecto, 10 (o el 10% del rango)
const umbralNCF = (e, s) => num(e.alertaNCF) || Math.max(10, Math.ceil((num(s.hasta) - num(s.desde) + 1) * 0.1) || 10);
function estadoSeq(e, t) {
  const s = seqInfo(e, t);
  if (!s) return { s: null, k: 'inactiva', l: 'Inactiva', c: 'gray' };
  if (s.vencida) return { s, k: 'vencida', l: 'Vencida', c: 'red' };
  if (s.restantes === 0) return { s, k: 'agotada', l: 'Agotada', c: 'red' };
  if (s.restantes !== Infinity && s.restantes <= umbralNCF(e, s)) return { s, k: 'baja', l: 'Por agotarse', c: 'amber' };
  if (s.vence && daysBetween(today(), s.vence) <= 30) return { s, k: 'porvencer', l: 'Por vencer', c: 'amber' };
  return { s, k: 'ok', l: 'Disponible', c: 'green' };
}
function alertasNCF(e) {
  return Object.keys(NCF_TIPOS).map(t => ({ t, ...estadoSeq(e, t) })).filter(x => x.s && x.k !== 'ok').map(({ t, s, k }) =>
    k === 'vencida' ? ['err', `Secuencia ${t} vencida desde ${fdate(s.vence)}: no puedes facturar con ${t}.`]
    : k === 'agotada' ? ['err', `Secuencia ${t} agotada: no puedes facturar con ${t} hasta registrar una nueva autorización.`]
    : k === 'baja' ? ['warn', `Secuencia ${t}: quedan solo ${s.restantes} comprobantes.`]
    : ['warn', `Secuencia ${t} vence el ${fdate(s.vence)}.`]);
}
// Bloquea la emisión si la secuencia no permite facturar (además de la validación en la base de datos)
function bloqueoNCF(e, tipo) {
  if (!tipo || tipo === TIPO_NONE) return '';
  const st = estadoSeq(e, tipo);
  if (st.k === 'inactiva') return `No tienes una secuencia activa de ${tipo}. Regístrala en Secuencias NCF.`;
  if (st.k === 'vencida') return `La secuencia ${tipo} venció el ${fdate(st.s.vence)}. Solicita una nueva a la DGII y regístrala en Secuencias NCF.`;
  if (st.k === 'agotada') return `Se agotaron los comprobantes ${tipo} (hasta el ${st.s.hasta}). Solicita una nueva secuencia a la DGII y regístrala en Secuencias NCF.`;
  return '';
}

  const activas = est.filter(x => x.s), inactivas = est.filter(x => !x.s);
  const problemas = activas.filter(x => ['agotada', 'vencida'].includes(x.k)), avisos = activas.filter(x => ['baja', 'porvencer'].includes(x.k));
  const ncf = (t, n) => t + pad(n, esECF(t) ? 10 : 8);
  v.innerHTML = `
  <div class="page-head"><h1>Secuencias NCF</h1>${esAdmin() ? `<button class="btn" onclick="A.alertaNCF()">${icon('gear')} Alerta: ${num(e.alertaNCF) ? `quedan ${num(e.alertaNCF)}` : 'automática'}</button>` : ''}</div>
  ${problemas.map(x => `<div class="alert err mb"><div><b>${x.t} · ${esc(nombreTipo(x.t))}:</b> ${esc(bloqueoNCF(e, x.t))} <b>No podrás facturar con este tipo hasta entonces.</b></div></div>`).join('')}
  ${avisos.map(x => `<div class="alert warn mb"><div><b>${x.t}:</b> ${x.k === 'baja' ? `quedan solo <b>${x.s.restantes}</b> comprobantes.` : `la secuencia vence el <b>${fdate(x.s.vence)}</b>.`} Solicita una nueva en la Oficina Virtual de la DGII.</div></div>`).join('')}
  <div class="grid g3">
    ${activas.map(({ t, s, l, c }) => {
      const total = s.hasta ? num(s.hasta) - num(s.desde) + 1 : 0, pct = total ? Math.min(100, Math.round(s.usadas / total * 100)) : 0;
      const prox = Math.max(num(s.actual) + 1, num(s.desde));

        <div style="margin:14px 0 6px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden"><div style="height:100%;width:${pct}%;background:${c === 'green' ? 'var(--primary)' : c === 'amber' ? 'var(--amber)' : 'var(--red)'}"></div></div>
        <div class="small muted">${s.usadas.toLocaleString('en-US')} usados${total ? ` de ${total.toLocaleString('en-US')}` : ''} · <b style="color:var(--text)">${s.restantes === Infinity ? 'sin límite' : s.restantes.toLocaleString('en-US') + ' disponibles'}</b></div>

  ${inactivas.length && esAdmin() ? `<div class="card mt"><div class="card-h">Otros tipos de comprobante (inactivos)</div><div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap">

  ${(e.historialNCF || []).length ? `<div class="card mt"><div class="card-h">Historial de autorizaciones</div><div class="tbl-wrap"><table><thead><tr><th>Registrada</th><th>Tipo</th><th>Rango</th><th>Vence</th><th>Autorización DGII</th></tr></thead><tbody>
    ${e.historialNCF.slice().reverse().map(h => `<tr><td class="nowrap">${fdate(h.fecha)}</td><td><span class="tag">${h.tipo}</span></td><td class="mono small">${ncf(h.tipo, h.desde)} – ${h.hasta ? ncf(h.tipo, h.hasta) : '…'}</td><td>${h.vence ? fdate(h.vence) : '—'}</td><td class="mono small">${esc(h.autorizacion || '—')}</td></tr>`).join('')}
  </tbody></table></div></div>` : ''}`;
}
A.nuevaSecuencia = (t, corregir) => {
  const e = emp(), s = e.secuencias?.[t] || {};
  const actual = corregir ? s : { desde: '', hasta: '', actual: '', vence: SIN_VENCE.includes(t) ? '' : `${new Date().getFullYear() + 1}-12-31` };
  modal(`${corregir ? 'Corregir' : 'Nueva autorización'} · ${t} ${esc(nombreTipo(t))}`, `
    ${corregir ? '' : `<div class="alert info mb"><div>Escribe el rango que te aprobó la DGII (por ejemplo, del <span class="mono">${t}${pad(1, esECF(t) ? 10 : 8)}</span> al <span class="mono">${t}${pad(50, esECF(t) ? 10 : 8)}</span> → desde 1, hasta 50). La numeración continuará desde "Desde".</div></div>`}
    <div class="fgrid">
      <div class="field"><label>Desde (número)</label><input class="in" name="desde" type="number" min="1" value="${actual.desde ?? ''}" required></div>
      <div class="field"><label>Hasta (número)</label><input class="in" name="hasta" type="number" min="1" value="${actual.hasta ?? ''}" required></div>
      ${corregir ? `<div class="field"><label>Último usado</label><input class="in" name="actual" type="number" min="0" value="${s.actual ?? 0}"><span class="hint small muted">0 si no has usado ninguno.</span></div>` : ''}
      <div class="field"><label>Vence</label><input class="in" name="vence" type="date" value="${actual.vence || ''}"></div>
      ${corregir ? '' : `<div class="field"><label>No. de autorización DGII (opcional)</label><input class="in" name="autorizacion"></div>`}
    </div>`, {
    okText: 'Guardar', onOk: async form => {
      const desde = num(fv(form, 'desde')), hasta = num(fv(form, 'hasta')), vence = fv(form, 'vence');
      if (!(desde >= 1) || !(hasta >= desde)) { toast('"Hasta" debe ser mayor o igual que "Desde".', 'error'); return false; }
      if (!vence && !SIN_VENCE.includes(t)) { toast('Indica la fecha de vencimiento.', 'error'); return false; }
      if (String(hasta).length > (esECF(t) ? 10 : 8)) { toast('El número excede los dígitos del comprobante.', 'error'); return false; }
      // Una autorización nueva no puede reusar números ya emitidos de la anterior
      if (!corregir && s.activo && desde <= num(s.actual) && hasta >= num(s.desde)) { toast(`El rango choca con números ya usados (hasta el ${s.actual}).`, 'error'); return false; }
      const nueva = { activo: true, desde, hasta, actual: corregir ? num(fv(form, 'actual')) : desde - 1, vence };
      chk(await sb.from('secuencias').upsert(seqRow(e.id, t, nueva), { onConflict: 'empresa_id,tipo' }));
      if (!corregir) {

        chk(await sb.from('empresas').update({ data: { ...empresaData(e), historialNCF } }).eq('id', e.id));
      }
      await reloadEmpresa(e.id);
      toast(`Secuencia ${t} guardada`, 'ok'); route(true);
    },
  });
};

/* ---------- Consulta de RNC en la DGII (vía /api/rnc del Worker) ---------- */
const rncCache = {};
function rncField(valor, ctx, estado = '') {
  return `<div class="field" style="grid-column:1/-1"><label>RNC o cédula</label>
    <div style="display:flex;gap:8px"><input class="in" name="rnc" value="${esc(fmtId(valor))}" placeholder="131-00000-1" inputmode="numeric"
      oninput="A.rncAuto(this,'${ctx}')" onkeydown="if(event.key==='Enter'){event.preventDefault();A.buscarRNC(this.form,'${ctx}')}">
      <button type="button" class="btn" onclick="A.buscarRNC(this.form,'${ctx}')">${icon('search')} Buscar en DGII</button></div>
    <input type="hidden" name="estadoDGII" value="${esc(estado)}">
    <span class="hint rnc-info">Escribe el RNC (9 dígitos) o la cédula (11) y se completan los datos desde la DGII.</span></div>`;
}
async function consultarRNC(rnc) {
  rnc = digits(rnc);
  if (rncCache[rnc]) return rncCache[rnc];
  let r;
  try { r = await fetch('/api/rnc?rnc=' + rnc); } catch (e) { throw new Error('Sin conexión para consultar la DGII.'); }
  const tipo = r.headers.get('content-type') || '';
  if (!tipo.includes('application/json')) throw new Error('La consulta a la DGII solo funciona en la app publicada.');

/* ---------- RST (Régimen Simplificado de Tributación): estimado del impuesto anual ----------
   Fórmulas de la calculadora RST de la DGII (verificadas con sus resultados para 2026):
   · Ingresos, persona física: renta neta = 60% de los ingresos → escala del ISR de personas físicas. 2 cuotas.
   · Ingresos, persona jurídica: 7% de los ingresos. 4 cuotas.
   · Compras: renta neta = compras × margen bruto → escala sin exención; ITBIS = compras × margen × 18% × base gravada. 4 cuotas. */
const RST_MARGEN_DEF = 8.38;
// Tramos [desde, monto fijo, tasa sobre el excedente], tal como los aplica la DGII
const RST_ESCALA_PF = [[0, 0, 0], [416220.01, 0, 0.15], [624329.01, 31216, 0.20], [867123.01, 79776, 0.25]];
const RST_ESCALA_COMPRAS = [[0, 0, 0.15], [208109.01, 31216.35, 0.20], [450903.01, 79775.15, 0.25]];
function isrEscala(renta, escala) {
  const [desde, fijo, tasa] = escala.filter(t => renta >= t[0]).pop();
  return r2(fijo + (renta - desde) * tasa);
}
function rstCalcular({ modo, persona, monto, margen, baseItbis }) {
  monto = Math.max(0, num(monto));
  if (modo === 'compras') {
    const renta = r2(monto * margen / 100), isr = isrEscala(renta, RST_ESCALA_COMPRAS);
    const itbis = r2(renta * 0.18 * baseItbis / 100);
    return { renta, isr, itbis, total: r2(isr + itbis), cuotas: 4 };
  }
  if (persona === 'pj') { const isr = r2(monto * 0.07); return { renta: null, isr, itbis: 0, total: isr, cuotas: 4 }; }
  const renta = r2(monto * 0.60), isr = isrEscala(renta, RST_ESCALA_PF);
  return { renta, isr, itbis: 0, total: isr, cuotas: 2 };
}
const LRST = {};
function repRST(el) {
  const e = emp(), hoy = today(), anioAct = +hoy.slice(0, 4);
  const anio = LRST.anio || anioAct;
  const modo = LRST.modo || (e.regimen === 'rst_compras' ? 'compras' : 'ingresos');
  const persona = LRST.persona || e.rstPersona || (digits(e.rnc).length === 9 ? 'pj' : 'pf');
  const margen = num(e.rstMargen ?? RST_MARGEN_DEF), baseItbis = num(e.rstBaseItbis ?? 100);
  const delAnio = f => f.fecha.slice(0, 4) === String(anio) && vigente(f);
  // Ingresos: ventas sin ITBIS (las notas de crédito restan). Compras: lo guardado en la empresa o, si no, los e-CF de compras/gastos.
  const ventas = facturas().filter(f => delAnio(f) && !esEgreso(f.tipo));
  const ingresos = r2(ventas.reduce((s, f) => s + signo(f) * calc(f).base, 0));
  const itbisVentas = r2(ventas.reduce((s, f) => s + signo(f) * calc(f).itbis, 0));
  const comprasApp = r2(facturas().filter(f => delAnio(f) && esEgreso(f.tipo)).reduce((s, f) => s + calc(f).base, 0)
    + gastos().filter(g => g.fecha.slice(0, 4) === String(anio) && esCompraG(g)).reduce((s, g) => s + calcG(g).base, 0));
  const comprasGuard = e.rstCompras?.[anio];
  const compras = comprasGuard != null ? num(comprasGuard) : comprasApp;
  const base = modo === 'compras' ? compras : ingresos;
  // Proyección al cierre: lo acumulado entre la fracción del año transcurrida
  const fin = new Date(anio, 11, 31), ini = new Date(anio, 0, 1);
  // Las compras escritas a mano se toman como el total del año (sin proyectar)
  const frac = anio < anioAct || (modo === 'compras' && comprasGuard != null) ? 1 : Math.min(1, (new Date(hoy + 'T12:00:00') - ini) / (fin - ini + 864e5));
  const proy = frac > 0 && frac < 1 ? r2(base / frac) : base;
  const sim = LRST.sim != null ? num(LRST.sim) : null;
  const params = { modo, persona, margen, baseItbis };
  const cols = [['Acumulado ' + (anio === anioAct ? 'a la fecha' : anio), base], ...(frac > 0 && frac < 1 ? [['Proyectado al cierre de ' + anio, proy]] : []), ...(sim != null ? [['Simulación', sim]] : [])]
    .map(([l, m]) => ({ l, m, r: rstCalcular({ ...params, monto: m }) }));
  const etiqueta = modo === 'compras' ? 'Compras' : 'Ingresos';
  const fila = (l, fn, fuerte) => `<tr${fuerte ? ' style="font-weight:700"' : ''}><td>${l}</td>${cols.map(c => `<td class="right">${fn(c)}</td>`).join('')}</tr>`;

  el.innerHTML = `
  ${noRST ? `<div class="alert warn mb"><div>Esta empresa está en el <b>régimen ordinario</b>. Puedes usar este cálculo como simulación; para marcarla como RST ve a <b>Empresas → Editar → Régimen tributario</b>.</div></div>` : ''}
  <div class="toolbar">
    <label class="chip-select"><span>Año fiscal:</span><select onchange="A.rst('anio',+this.value)">${[anioAct, anioAct - 1, anioAct - 2].map(y => `<option ${y === anio ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
    <label class="chip-select"><span>Modalidad:</span><select onchange="A.rst('modo',this.value)"><option value="ingresos" ${modo === 'ingresos' ? 'selected' : ''}>Basado en ingresos</option><option value="compras" ${modo === 'compras' ? 'selected' : ''}>Basado en compras</option></select></label>
    ${modo === 'ingresos' ? `<label class="chip-select"><span>Contribuyente:</span><select onchange="A.rst('persona',this.value)"><option value="pf" ${persona === 'pf' ? 'selected' : ''}>Persona física</option><option value="pj" ${persona === 'pj' ? 'selected' : ''}>Persona jurídica</option></select></label>` : ''}
  </div>
  <div class="grid g4 mb">
    <div class="card kpi"><div class="l">${etiqueta} ${anio === anioAct ? 'a la fecha' : anio}</div><div class="v">${money(base)}</div>${modo === 'ingresos' ? `<div class="d">${ventas.length} documentos · sin ITBIS</div>` : `<div class="d">${comprasGuard != null ? 'Monto registrado manualmente' : 'Según compras/gastos en la app'}</div>`}</div>
    ${frac > 0 && frac < 1 ? `<div class="card kpi"><div class="l">Proyectado al cierre</div><div class="v">${money(proy)}</div><div class="d">${Math.round(frac * 100)}% del año transcurrido</div></div>` : ''}
    ${(() => { const r = cols[frac > 0 && frac < 1 ? 1 : 0].r; return `<div class="card kpi"><div class="l">Estimado a pagar ${frac > 0 && frac < 1 ? '(proyectado)' : ''}</div><div class="v">${money(r.total)}</div><div class="d">${r.cuotas} cuotas de ${money(r2(r.total / r.cuotas))}</div></div>`; })()}
    ${modo === 'ingresos' ? `<div class="card kpi"><div class="l">ITBIS facturado ${anio}</div><div class="v">${money(itbisVentas)}</div><div class="d">Se declara aparte (IT-1 mensual)</div></div>` : ''}
  </div>
  <div class="grid" style="grid-template-columns:2fr 1fr">
    <div class="card"><div class="card-h">Cálculo RST · ${modo === 'compras' ? 'basado en compras' : `basado en ingresos · ${persona === 'pj' ? 'persona jurídica' : 'persona física'}`}</div>
      <div class="tbl-wrap"><table><thead><tr><th></th>${cols.map(c => `<th class="right">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>
        ${fila(etiqueta, c => money(c.m))}
        ${modo === 'compras' ? fila(`Renta neta imponible (margen ${margen}%)`, c => money(c.r.renta)) : persona === 'pf' ? fila('Renta neta (60% de los ingresos)', c => money(c.r.renta)) : ''}
        ${fila(modo === 'ingresos' && persona === 'pj' ? 'ISR (7% de los ingresos)' : 'ISR según escala', c => money(c.r.isr))}
        ${modo === 'compras' ? fila(`ITBIS (18% del margen · base gravada ${baseItbis}%)`, c => money(c.r.itbis)) : ''}
        ${fila('Total estimado a pagar', c => money(c.r.total), true)}
        ${fila(`Cada cuota (${cols[0].r.cuotas})`, c => money(r2(c.r.total / c.r.cuotas)))}
      </tbody></table></div></div>
    <div class="card"><div class="card-h">Ajustar datos</div><div class="card-b">
      ${modo === 'compras' ? `<div class="field"><label>Compras del año ${anio} (RD$)</label><input class="in" id="rst-compras-in" type="number" step="0.01" min="0" value="${comprasGuard != null ? num(comprasGuard).toFixed(2) : ''}" placeholder="${comprasApp.toFixed(2)}">
        <span class="hint small muted">La app no registra todas tus compras: escribe el total de compras del año completo (o tu estimado), según tu formato 606.</span></div>
        <button class="btn sm mb" onclick="A.rstGuardarCompras(${anio})">${icon('edit')} Guardar compras</button>` : ''}
      <div class="field"><label>Simular con otro monto de ${etiqueta.toLowerCase()} (RD$)</label><input class="in" id="rst-sim" type="number" step="0.01" min="0" value="${sim != null ? sim : ''}" placeholder="Ej.: 2500000"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="A.rst('sim',$('#rst-sim').value===''?null:+$('#rst-sim').value)">Simular</button>${sim != null ? `<button class="btn sm ghost" onclick="A.rst('sim',null)">Quitar</button>` : ''}</div>
    </div></div>
  </div>
  <div class="hint small muted mt">Estimado con las fórmulas de la <a href="https://dgii.gov.do/herramientas/calculadoras/Paginas/calculadoraRST.aspx" target="_blank" rel="noopener" style="text-decoration:underline">calculadora RST de la DGII</a> (escala 2026). No considera las retenciones de ISR que te hayan hecho ni anticipos pagados; el monto oficial es el de tu declaración en la Oficina Virtual.</div>`;
}

A.logoFile = input => {

  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      logoTmp = c.toDataURL('image/png');
      $('#logo-prev').innerHTML = `<img src="${logoTmp}" style="width:56px;height:56px;object-fit:contain;border-radius:8px;background:var(--soft)">`;
    };
    img.onerror = () => toast('No se pudo leer la imagen.', 'error');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
};

    for (const e of src.empresas) {

      ultima = eid;

      chk(await sb.from('secuencias').upsert(seqRows(eid, secuencias || {}), { onConflict: 'empresa_id,tipo' }));
      const mapC = {}, mapP = {}, mapF = {};
      const cs = (src.clientes || []).filter(c => !c.empresaId || c.empresaId === oldId);
      const ps = (src.productos || []).filter(p => !p.empresaId || p.empresaId === oldId);
      const fs = (src.facturas || []).filter(f => !f.empresaId || f.empresaId === oldId);
      cs.forEach(c => mapC[c.id] = uid()); ps.forEach(p => mapP[p.id] = uid()); fs.forEach(f => mapF[f.id] = uid());
      const insert = async (table, rows) => { for (let i = 0; i < rows.length; i += 300) chk(await sb.from(table).insert(rows.slice(i, i + 300))); };
      await insert('clientes', cs.map(c => ({ id: mapC[c.id], empresa_id: eid, data: stripIds(c) })));
      await insert('productos', ps.map(p => ({ id: mapP[p.id], empresa_id: eid, data: stripIds(p) })));
      await insert('facturas', fs.map(f => {
        const { _v, ...rest } = stripIds(f);
        const data = { ...rest, clienteId: mapC[f.clienteId] || '', facturaAfectadaId: mapF[f.facturaAfectadaId] || '', items: (f.items || []).map(it => ({ ...it, productoId: mapP[it.productoId] || '' })) };
        return { id: mapF[f.id], empresa_id: eid, numero: f.numero, tipo: f.tipo, ncf: f.ncf || null, fecha: f.fecha, data };
      }));
    }
    await loadEmpresas();
    if (ultima) await activarEmpresa(ultima);
    toast('Importación completada', 'ok');
    location.hash = '#/dashboard'; route();
  } catch (err) {
    console.error(err); toast('Error al importar: ' + errMsg(err), 'error');
    try { await loadEmpresas(); if (!emp()) await activarEmpresa(DB.empresas[0]?.id || null); } catch (e) { }
    route();
  } finally { busy(false); }
}

// Código QR (versión 8 como pide la DGII; si el contenido no cabe, versión automática)
function qrSVG(texto) {
  if (typeof qrcode === 'undefined' || !texto) return '';
  // Se genera como imagen (no SVG) para que también se vea nítido en los PDF generados.
  for (const version of [8, 0]) {
    try { const qr = qrcode(version, 'L'); qr.addData(texto); qr.make(); return `<img src="${qr.createDataURL(6, 0)}" alt="Código QR">`; } catch (e) { }
  }
  return '';
}

}

  const pick = a => a[Math.floor(rnd() * a.length)];
  const y = new Date().getFullYear();

    ['Juan Pérez (demo)', '00100000001', '(829) 555-0133', 'Los Jardines, Santiago'],
    ['Ferretería Modelo SRL', '132000033', '(809) 555-0144', 'Carretera Duarte km 5'],
    ['Ayuntamiento Demo', '401000044', '(809) 555-0155', 'Parque Central'],
  ].map(([nombre, rnc, telefono, direccion]) => ({ id: uid(), empresaId: e.id, creado: new Date().toISOString(), nombre, rnc, telefono, email: '', direccion, notas: '' }));
  const prods = [
    ['00976', 'Aceite de motor 1/4', 'bien', 500, 18], ['00502', 'Filtro de aire', 'bien', 1000, 18], ['087295', 'Bujía NGK', 'bien', 300, 18],
    ['01015', 'Mano de obra', 'servicio', 550, 18], ['01426', 'Limpieza de tanque', 'servicio', 500, 18], ['02001', 'Diagnóstico general', 'servicio', 1500, 18],
    ['03003', 'Manguera de gasolina', 'bien', 150, 18], ['04004', 'Carburador completo', 'bien', 3200, 18],
  ].map(([sku, descripcion, tipo, precio, itbis]) => ({ id: uid(), empresaId: e.id, sku, descripcion, tipo, precio, itbis }));
  const fechas = []; for (let i = 0; i < 46; i++) fechas.push(addDays(today(), -Math.floor(rnd() * 330)));
  fechas.sort();
  const nuevas = [];
  fechas.forEach((fecha, i) => {
    const cli = rnd() < 0.4 ? null : pick(cls);
    const tipo = !cli ? 'B02' : cli.rnc.startsWith('4') ? 'B15' : 'B01';
    const n = 1 + Math.floor(rnd() * 3);
    const items = []; for (let k = 0; k < n; k++) { const p = pick(prods); items.push({ productoId: p.id, sku: p.sku, descripcion: p.descripcion, cantidad: 1 + Math.floor(rnd() * 3), precio: p.precio, descuento: 0, itbis: p.itbis }); }
    const credito = !!cli && rnd() < 0.5;
    const s = e.secuencias[tipo]; s.actual++;
    const f = {
      id: uid(), empresaId: e.id, creada: new Date(fecha + 'T10:00:00').toISOString(), estado: 'emitida', tipo,

      items, propina: false, notas: e.notaPie, facturaAfectadaId: '', pagos: [],

async function boot(session) {
  SESSION = session;
  BOOTING = true; route();
  try {
    await sb.rpc('aceptar_invitaciones');
    await loadEmpresas();
    let id = null;
    try { id = localStorage.getItem(activeKey()); } catch (e) { }
    if (!DB.empresas.some(e => e.id === id)) id = DB.empresas[0]?.id || null;
    await activarEmpresa(id);
  } catch (err) {
    console.error(err);
    BOOTING = false;
    document.body.classList.add('auth-mode');
    $('#view').innerHTML = `<div class="auth-wrap"><div class="card auth-card"><div class="alert err">${esc(errMsg(err))}</div>
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="location.reload()">Reintentar</button><button class="btn" onclick="A.logout()">Cerrar sesión</button></div></div></div>`;
    return;
  }
  BOOTING = false; route();
}
let bootedFor = null;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') setTimeout(pedirNuevaPassword, 300);
  if (event === 'INITIAL_SESSION' && !session) { BOOTING = false; route(); return; }
  const prev = SESSION?.user?.id, next = session?.user?.id;
  if (next && next !== bootedFor) { bootedFor = next; setTimeout(() => boot(session), 0); return; }
  if (!next && prev) {
    SESSION = null; DB = blankDB(); bootedFor = null;
    if (channel) { sb.removeChannel(channel); channel = null; }
    authMode = 'login'; route(); return;
  }
  if (session) SESSION = session;
});
