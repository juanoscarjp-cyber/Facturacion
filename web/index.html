<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturación RD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f6f6f8; --card:#fff; --border:#e6e7eb; --border2:#d6d8de; --text:#14151a; --muted:#6b7080; --soft:#f2f3f6;
  --primary:#1f1b4d; --primary-h:#2d2870; --accent:#e11d48;
  --green:#15803d; --green-bg:#e8f5ec; --blue:#1d4ed8; --blue-bg:#e8eefc; --amber:#b45309; --amber-bg:#fdf3e1;
  --red:#b91c1c; --red-bg:#fdecec; --gray:#555b66; --gray-bg:#eef0f3; --purple:#6d28d9; --purple-bg:#f1ebfd;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
/* Sidebar */
#sidebar{width:240px;flex:0 0 240px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
.emp-switch{margin:0 12px 10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--soft)}
.emp-switch label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.emp-switch select{width:100%;border:0;background:transparent;font-weight:600;outline:none;cursor:pointer}
nav{padding:4px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#3a3f4b;font-weight:500}
nav a:hover{background:var(--soft)}
nav a.active{background:var(--primary);color:#fff}
nav a svg{width:18px;height:18px;flex:0 0 auto}
.side-foot{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar .crumbs{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumbs b{color:var(--text);font-weight:600}
.btn.menu-btn{display:none}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:12px}
#view{padding:24px;max-width:1240px;width:100%;margin:0 auto}
/* Common */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:26px;margin:0;letter-spacing:-.02em;flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-head h1 .mono{font-family:var(--mono);font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--border2);background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--red);border-color:#f2c4c4}
.btn.danger:hover{background:var(--red-bg)}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}.right{text-align:right}.nowrap{white-space:nowrap}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border2);border-radius:12px;background:#fff;outline:none}
.search input:focus{border-color:var(--primary)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.chip-select{display:flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:12px;background:#fff;padding:0 10px}
.chip-select span{color:var(--muted);font-size:13px;white-space:nowrap}
.chip-select select,.chip-select input{border:0;background:transparent;padding:10px 2px;font-weight:600;outline:none;cursor:pointer}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:11px 14px;background:#fafafb;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fafafc}
.tbl-wrap{overflow-x:auto}
.table-foot{padding:12px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sub{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.green{color:var(--green);background:var(--green-bg)}.pill.blue{color:var(--blue);background:var(--blue-bg)}
.pill.amber{color:var(--amber);background:var(--amber-bg)}.pill.red{color:var(--red);background:var(--red-bg)}
.pill.gray{color:var(--gray);background:var(--gray-bg)}.pill.purple{color:var(--purple);background:var(--purple-bg)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--soft);font-size:11px;font-weight:600;color:#3a3f4b;font-family:var(--mono)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* KPI */
.kpi{padding:16px 18px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
/* Detail */
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.totals{margin-left:auto;width:min(360px,100%);padding:14px 18px}
.totals .row{display:flex;justify-content:space-between;padding:4px 0}
.totals .row.big{font-size:17px;font-weight:700;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.totals .row.due{color:var(--red);font-weight:700}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:#3a3f4b}
.field .hint{font-size:11px;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:9px;background:#fff;outline:none;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,27,77,.08)}
input.in:disabled,select.in:disabled{background:var(--soft);color:var(--muted)}
textarea.in{resize:vertical;min-height:70px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.items-tbl td{padding:6px 6px;border-bottom:1px solid var(--border)}
.items-tbl th{padding:9px 6px}
.items-tbl input.in,.items-tbl select.in{padding:7px 8px}
.items-tbl .num{text-align:right}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:6px;border-radius:7px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--red-bg);color:var(--red)}
.icon-btn svg{width:16px;height:16px}
.form-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.sticky{position:sticky;top:72px}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--amber-bg);color:#7a3f06}.alert.err{background:var(--red-bg);color:#7f1515}.alert.info{background:var(--blue-bg);color:#1e3a8a}
.section-title{font-size:13px;font-weight:700;margin:18px 0 10px;color:#3a3f4b}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,17,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column}
.modal.wide{width:min(880px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center}
.modal-h span{flex:1}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1b1d24;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.error{background:var(--red)}.toast.ok{background:var(--green)}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--primary)}.chart .bar2{fill:#c9c6ef}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* Empresa cards */
.emp-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.emp-card .top{display:flex;gap:12px;align-items:center}
.emp-card img,.emp-logo{width:46px;height:46px;border-radius:10px;object-fit:contain;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.seq-tbl input.in{padding:6px 8px}
.seq-tbl td,.seq-tbl th{padding:6px 6px}
.onboard{max-width:620px;margin:40px auto;text-align:center}
.onboard .logo{width:56px;height:56px;font-size:28px;border-radius:14px;margin:0 auto 16px}
.onboard h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
.onboard p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Auth */
body.auth-mode #sidebar, body.auth-mode .topbar{display:none}
.auth-wrap{min-height:calc(100vh - 48px);display:grid;place-items:center}
.auth-card{width:min(400px,100%);padding:28px}
.auth-card .logo{margin:0 auto 14px;width:48px;height:48px;font-size:24px;border-radius:12px}
.auth-card h1{text-align:center;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.auth-card p.sub2{text-align:center;color:var(--muted);margin:0 0 20px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.linkish{background:none;border:0;color:var(--primary);cursor:pointer;text-decoration:underline;padding:0;font-size:13px}
.avatar{cursor:pointer;border:0}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:none;place-items:center;font-weight:600}
#busy.on{display:grid}
.spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
/* Responsive */
@media (max-width:980px){
  .form-layout{grid-template-columns:1fr}
  .sticky{position:static}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr}
}
@media (max-width:860px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  body.nav-open #sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .btn.menu-btn{display:inline-flex}
  #view{padding:16px}
  .topbar{padding:0 16px}
  .g2{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (max-width:520px){ .g4{grid-template-columns:1fr} .page-head h1{font-size:22px} }

/* ===== Print ===== */
#print-area{display:none}
@media print{
  body{background:#fff}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important;color:#000;font-size:12px}
}
.p-doc{font-family:Arial,Helvetica,sans-serif;color:#111}
.p-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px}
.p-emp{display:flex;gap:12px;align-items:flex-start}
.p-emp img{max-width:110px;max-height:80px;object-fit:contain}
.p-emp h2{margin:0 0 3px;font-size:18px}
.p-emp div{font-size:11px;line-height:1.5}
.p-title{text-align:right}
.p-title h1{margin:0 0 6px;font-size:16px;letter-spacing:.02em}
.p-title table td{padding:1px 0 1px 10px;border:0;font-size:11px;text-align:right}
.p-box{display:flex;gap:20px;margin:14px 0;font-size:11px}
.p-box > div{flex:1;border:1px solid #bbb;border-radius:6px;padding:8px 10px}
.p-box b.l{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:3px}
.p-items{width:100%;border-collapse:collapse;font-size:11px}
.p-items th{background:#eee;color:#111;font-size:10px;padding:6px;border:0;border-bottom:1px solid #999}
.p-items td{padding:6px;border-bottom:1px solid #ddd}
.p-tot{width:260px;margin:12px 0 0 auto;font-size:12px}
.p-tot div{display:flex;justify-content:space-between;padding:2px 0}
.p-tot .t{font-weight:700;font-size:14px;border-top:1.5px solid #111;margin-top:4px;padding-top:5px}
.p-notes{margin-top:16px;font-size:11px;white-space:pre-wrap}
.p-sign{display:flex;gap:60px;margin-top:60px;font-size:11px}
.p-sign div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px}
.p-foot{margin-top:24px;text-align:center;font-size:10px;color:#555}
.p-ecf{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:18px}
.p-qr svg{width:28mm;height:28mm;display:block;padding:3mm;box-sizing:content-box}
#print-area.ticket .p-qr svg{width:30mm;height:30mm;margin:4px auto}
/* ticket */
#print-area.ticket .p-doc{width:72mm;font-size:11px}
.tk{text-align:center}
.tk h2{font-size:14px;margin:4px 0}
.tk img{max-width:40mm;max-height:22mm}
.tk-line{border-top:1px dashed #000;margin:6px 0}
.tk-row{display:flex;justify-content:space-between;gap:6px}
.tk-l{text-align:left}
</style>
<style id="page-style">@page{size:letter;margin:12mm}</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">F</div><div><b>Facturación RD</b><small>Comprobantes fiscales NCF</small></div></div>
    <div class="emp-switch" id="emp-switch"></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="side-foot">Datos sincronizados en la nube.</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn ghost sm menu-btn" onclick="document.body.classList.toggle('nav-open')" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <button class="avatar" id="avatar" onclick="A.miCuenta()" title="Mi cuenta">—</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="print-area"></div>
<div id="busy"><div><div class="spinner"></div><span id="busy-txt">Cargando…</span></div></div>

<script>
'use strict';
/* =========================================================
   Facturación RD — app de facturación con NCF (DGII)
   Todo en un archivo, datos en localStorage.
   ========================================================= */
const KEY = 'facturacion_rd_v1';
const A = window.A = {};

const NCF_TIPOS = {
  B01: { nombre: 'Crédito Fiscal', titulo: 'FACTURA DE CRÉDITO FISCAL', requiereRNC: true },
  B02: { nombre: 'Consumo', titulo: 'FACTURA DE CONSUMO' },
  B14: { nombre: 'Régimen Especial', titulo: 'FACTURA DE RÉGIMEN ESPECIAL', requiereRNC: true },
  B15: { nombre: 'Gubernamental', titulo: 'FACTURA GUBERNAMENTAL', requiereRNC: true },
  B04: { nombre: 'Nota de Crédito', titulo: 'NOTA DE CRÉDITO' },
  E31: { nombre: 'Crédito Fiscal Electrónica', titulo: 'FACTURA DE CRÉDITO FISCAL ELECTRÓNICA', requiereRNC: true, ecf: true },
  E32: { nombre: 'Consumo Electrónica', titulo: 'FACTURA DE CONSUMO ELECTRÓNICA', ecf: true },
  E34: { nombre: 'Nota de Crédito Electrónica', titulo: 'NOTA DE CRÉDITO ELECTRÓNICA', ecf: true },
  E44: { nombre: 'Régimen Especial Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO PARA REGÍMENES ESPECIALES', requiereRNC: true, ecf: true },
  E45: { nombre: 'Gubernamental Electrónica', titulo: 'COMPROBANTE ELECTRÓNICO GUBERNAMENTAL', requiereRNC: true, ecf: true },
};
const TIPOS_FACTURA = ['B02', 'B01', 'B14', 'B15', 'E31', 'E32', 'E44', 'E45'];
const esECF = t => /^E\d\d$/.test(t || '');
const esNota = t => t === 'B04' || t === 'E34';
const SIN_VENCE = ['E32', 'E34'];
const LIMITE_RFCE = 250000;
const TIPO_NONE = 'NONE';
const nombreTipo = t => t === TIPO_NONE ? 'Sin comprobante' : (NCF_TIPOS[t] ? NCF_TIPOS[t].nombre : t);
const METODOS = ['Efectivo', 'Tarjeta', 'Transferencia', 'Cheque', 'Otro'];
const ITBIS_TASAS = [18, 16, 0];
const MOTIVOS_ANULACION = {
  '01': 'Deterioro de factura pre-imprenta', '02': 'Errores de impresión (factura pre-imprenta)',
  '03': 'Impresión defectuosa', '04': 'Corrección de la información', '05': 'Cambio de productos',
  '06': 'Devolución de productos', '07': 'Omisión de productos', '08': 'Errores en secuencia de NCF',
  '09': 'Por cese de operaciones', '10': 'Pérdida o hurto de talonarios',
};
const ESTADOS = {
  emitida: ['Emitida', 'blue'], pagada: ['Pagada', 'green'], parcial: ['Pago parcial', 'amber'],
  vencida: ['Vencida', 'red'], anulada: ['Anulada', 'gray'], nota: ['Nota de crédito', 'purple'],
};
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function errMsg(err) {
  const m = String(err?.message || err || 'Error desconocido');
  if (/Invalid login credentials/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Debes confirmar tu email. Revisa tu bandeja de entrada.';
  if (/User already registered/i.test(m)) return 'Ya existe una cuenta con ese email. Inicia sesión.';
  if (/Password should be at least/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/facturas_empresa_numero_key/.test(m)) return 'Ya existe una factura con ese número. Ajusta el "Próximo número" en Empresas.';
  if (/facturas_empresa_ncf_key/.test(m)) return 'Ese NCF ya fue usado. Revisa el "Último usado" de la secuencia en Empresas.';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor. Revisa tu internet.';
  if (/relation .* does not exist|Could not find the (table|function)/i.test(m)) return 'La base de datos no está configurada. Ejecuta supabase/schema.sql en Supabase.';
  return m;
}

async function fetchAll(table, empresaId) {

  for (let from = 0; ; from += 1000) {

    out.push(...data);

async function mutateFactura(id, fn) {
  for (let i = 0; i < 3; i++) {
    const row = chk(await sb.from('facturas').select('*').eq('id', id).single());
    const f = fromFacturaRow(row);
    fn(f);
    const upd = chk(await sb.from('facturas').update({ data: facturaData(f), fecha: f.fecha }).eq('id', id).eq('updated_at', row.updated_at).select());
    if (upd.length) { const nf = fromFacturaRow(upd[0]); putCache('facturas', nf); return nf; }
  }

let channel = null, rtTimer = null;
function subscribe() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  const id = DB.activeId; if (!id) return;
  const f = `empresa_id=eq.${id}`;
  channel = sb.channel('emp-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'facturas', filter: f }, p => rtRow('facturas', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clientes', filter: f }, p => rtRow('clientes', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'productos', filter: f }, p => rtRow('productos', p))

    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'empresas', filter: `id=eq.${id}` }, () => rtEmpresa())

function calc(f) {
  let bruto = 0, desc = 0, itbis = 0, gravado = 0, exento = 0;
  for (const it of f.items || []) {
    const b = r2(num(it.cantidad) * num(it.precio));
    const d = r2(b * num(it.descuento) / 100);
    const base = r2(b - d);
    const tax = r2(base * num(it.itbis) / 100);
    bruto += b; desc += d; itbis += tax;
    if (num(it.itbis) > 0) gravado += base; else exento += base;
  }
  const base = r2(bruto - desc);
  const propina = f.propina ? r2(base * 0.10) : 0;
  return { bruto: r2(bruto), descuento: r2(desc), base, itbis: r2(itbis), propina, total: r2(base + itbis + propina), gravado: r2(gravado), exento: r2(exento) };
}
const pagado = f => r2((f.pagos || []).reduce((s, p) => s + num(p.monto), 0));
const notasDe = f => DB.facturas.filter(n => esNota(n.tipo) && n.facturaAfectadaId === f.id && n.estado !== 'anulada');
const totalNotas = f => r2(notasDe(f).reduce((s, n) => s + calc(n).total, 0));
function saldo(f) {
  if (f.estado === 'anulada' || esNota(f.tipo)) return 0;
  return Math.max(0, r2(calc(f).total - pagado(f) - totalNotas(f)));
}
function estado(f) {
  if (f.estado === 'anulada') return 'anulada';
  if (esNota(f.tipo)) return 'nota';
  if (saldo(f) <= 0.004) return 'pagada';
  if (pagado(f) > 0 || notasDe(f).length) return 'parcial';
  if (f.vencimiento && f.vencimiento < today()) return 'vencida';
  return 'emitida';
}
const pill = st => `<span class="pill ${ESTADOS[st][1]}">${ESTADOS[st][0]}</span>`;
const signo = f => esNota(f.tipo) ? -1 : 1;
const vigente = f => f.estado !== 'anulada';

function seqInfo(e, tipo) {
  const s = e.secuencias && e.secuencias[tipo];
  if (!s || !s.activo) return null;
  const usadas = Math.max(0, num(s.actual) - num(s.desde) + 1);
  const restantes = s.hasta ? Math.max(0, num(s.hasta) - Math.max(num(s.actual), num(s.desde) - 1)) : Infinity;
  return { ...s, usadas, restantes, vencida: s.vence && s.vence < today() };
}

let modalOk = null;
function modal(title, body, { okText = 'Guardar', onOk = null, wide = false, danger = false, cancelText = 'Cancelar', noFooter = false } = {}) {

      </div>`}
    </form>

  const first = $('#modal-root').querySelector('input:not([type=hidden]):not([type=checkbox]):not([disabled]),select,textarea');

A.closeModal = () => { $('#modal-root').innerHTML = ''; modalOk = null; };
A.modalSubmit = async form => {
  if (!modalOk) return A.closeModal();
  const btn = form.querySelector('button[type=submit]');
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  const fn = modalOk;
  try { const r = await fn(form); if (r !== false && modalOk === fn) A.closeModal(); }
  catch (err) { console.error(err); toast(errMsg(err), 'error'); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
};
function confirmar(title, msg, onYes, { okText = 'Confirmar', danger = true } = {}) {
  modal(title, `<p style="margin:0">${msg}</p>`, { okText, danger, onOk: () => onYes() });
}

function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function downloadCSV(name, rows) {

  download(name, '﻿' + csv, 'text/csv;charset=utf-8');
}

function viewDashboard(v) {
  const e = emp();

  const fs = facturas().filter(vigente);
  const hoy = today(), mes = hoy.slice(0, 7), anio = hoy.slice(0, 4);
  const delMes = fs.filter(f => f.fecha.slice(0, 7) === mes);
  const facturadoMes = r2(delMes.reduce((s, f) => s + signo(f) * calc(f).total, 0));
  const itbisMes = r2(delMes.reduce((s, f) => s + signo(f) * calc(f).itbis, 0));
  const cobradoMes = r2(fs.reduce((s, f) => s + (f.pagos || []).filter(p => p.fecha.slice(0, 7) === mes).reduce((a, p) => a + num(p.monto), 0), 0));
  const pendientes = fs.filter(f => saldo(f) > 0);
  const porCobrar = r2(pendientes.reduce((s, f) => s + saldo(f), 0));
  const vencidas = pendientes.filter(f => estado(f) === 'vencida');

  // Últimos 12 meses
  const meses = [];
  const d0 = new Date(); d0.setDate(1);
  for (let i = 11; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); meses.push(iso(d).slice(0, 7)); }
  const serie = meses.map(m => ({
    m,
    fact: r2(fs.filter(f => f.fecha.slice(0, 7) === m).reduce((s, f) => s + signo(f) * calc(f).total, 0)),
    cob: r2(fs.reduce((s, f) => s + (f.pagos || []).filter(p => p.fecha.slice(0, 7) === m).reduce((a, p) => a + num(p.monto), 0), 0)),
  }));

  // Top clientes del año
  const porCliente = {};
  fs.filter(f => f.fecha.slice(0, 4) === anio).forEach(f => {
    const k = f.clienteId || '_cf';
    porCliente[k] = porCliente[k] || { nombre: f.cliente?.nombre || 'Consumidor Final', total: 0, n: 0 };
    porCliente[k].total += signo(f) * calc(f).total; porCliente[k].n++;
  });
  const top = Object.values(porCliente).sort((a, b) => b.total - a.total).slice(0, 5);

  // Alertas NCF
  const alertas = [];
  Object.keys(NCF_TIPOS).forEach(t => {
    const s = seqInfo(e, t); if (!s) return;
    if (s.vencida) alertas.push(['err', `Secuencia ${t} vencida desde ${fdate(s.vence)}.`]);
    else if (s.vence && daysBetween(hoy, s.vence) <= 30) alertas.push(['warn', `Secuencia ${t} vence el ${fdate(s.vence)}.`]);
    if (s.restantes !== Infinity && s.restantes <= Math.max(10, (num(s.hasta) - num(s.desde) + 1) * 0.1))
      alertas.push([s.restantes === 0 ? 'err' : 'warn', `Secuencia ${t}: ${s.restantes === 0 ? 'agotada' : `quedan ${s.restantes} comprobantes`}.`]);
  });
  if (!TIPOS_FACTURA.some(t => seqInfo(e, t))) alertas.push(['info', 'No tienes secuencias NCF activas. Configúralas en Empresas para emitir comprobantes fiscales.']);

  const recientes = facturas().slice().sort((a, b) => (b.fecha + b.creada).localeCompare(a.fecha + a.creada)).slice(0, 8);

  v.innerHTML = `
  <div class="page-head"><h1>Dashboard</h1><a class="btn primary" href="#/facturas/nueva">${icon('plus')} Nueva factura</a></div>
  ${alertas.map(a => `<div class="alert ${a[0]} mb">${esc(a[1])} <a href="#/empresas" style="text-decoration:underline;margin-left:auto">Ver secuencias</a></div>`).join('')}
  <div class="grid g4">
    <div class="card kpi"><div class="l">Facturado del mes</div><div class="v">${money(facturadoMes)}</div><div class="d">${delMes.filter(f => !esNota(f.tipo)).length} facturas en ${MESES[+mes.slice(5) - 1]}</div></div>
    <div class="card kpi"><div class="l">Cobrado del mes</div><div class="v">${money(cobradoMes)}</div><div class="d">Pagos recibidos</div></div>
    <div class="card kpi"><div class="l">Por cobrar</div><div class="v" style="color:${porCobrar > 0 ? 'var(--amber)' : 'inherit'}">${money(porCobrar)}</div><div class="d">${pendientes.length} pendientes · ${vencidas.length} vencidas</div></div>
    <div class="card kpi"><div class="l">ITBIS del mes</div><div class="v">${money(itbisMes)}</div><div class="d">Facturado (neto de notas)</div></div>
  </div>
  <div class="grid mt" style="grid-template-columns:2fr 1fr">
    <div class="card"><div class="card-h">Ventas últimos 12 meses<span class="sp"></span>
      <div class="legend"><span><i style="background:var(--primary)"></i>Facturado</span><span><i style="background:#c9c6ef"></i>Cobrado</span></div></div>
      <div class="card-b chart">${barChart(serie)}</div></div>
    <div class="card"><div class="card-h">Mejores clientes ${anio}</div>
      ${top.length ? `<table><tbody>${top.map(c => `<tr><td>${esc(c.nombre)}<span class="sub">${c.n} documentos</span></td><td class="right nowrap">${money(c.total)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">Sin ventas este año</div>`}
    </div>
  </div>
  <div class="card mt"><div class="card-h">Facturas recientes<span class="sp"></span><a class="btn sm" href="#/facturas">Ver todas</a></div>
    ${recientes.length ? `<div class="tbl-wrap"><table><thead><tr><th>Número</th><th class="hide-sm">NCF</th><th>Cliente</th><th class="hide-sm">Fecha</th><th class="right">Total</th><th>Estado</th></tr></thead>
    <tbody>${recientes.map(rowFactura).join('')}</tbody></table></div>` : `<div class="empty">Aún no hay facturas. <a href="#/facturas/nueva" style="text-decoration:underline">Crea la primera</a>.</div>`}
  </div>`;
}
function barChart(serie) {
  const W = 640, H = 220, P = { l: 52, r: 8, t: 10, b: 26 };
  const max = Math.max(1, ...serie.map(s => Math.max(s.fact, s.cob)));
  const step = (W - P.l - P.r) / serie.length, bw = Math.min(16, step / 3);
  const y = val => P.t + (H - P.t - P.b) * (1 - Math.max(0, val) / max);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const val = max * i / 4, yy = y(val);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="#eceef2"/><text x="${P.l - 6}" y="${yy + 4}" text-anchor="end">${moneyShort(val).replace('RD$', '')}</text>`;
  }
  serie.forEach((s, i) => {
    const cx = P.l + step * i + step / 2;
    g += `<rect class="bar" x="${cx - bw - 1}" y="${y(s.fact)}" width="${bw}" height="${H - P.b - y(s.fact)}" rx="3"><title>${MESES[+s.m.slice(5) - 1]} ${s.m.slice(0, 4)} · Facturado ${money(s.fact)}</title></rect>`;
    g += `<rect class="bar2" x="${cx + 1}" y="${y(s.cob)}" width="${bw}" height="${H - P.b - y(s.cob)}" rx="3"><title>Cobrado ${money(s.cob)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MESES[+s.m.slice(5) - 1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes">${g}</svg>`;
}

  const q = LF.q.toLowerCase().trim(), qd = digits(q);

    if (LF.tipo === 'ventas' && esNota(f.tipo)) return false;
    if (LF.tipo && LF.tipo !== 'ventas' && f.tipo !== LF.tipo) return false;
    if (LF.desde && f.fecha < LF.desde) return false;
    if (LF.hasta && f.fecha > LF.hasta) return false;
    if (LF.estado === 'pendiente') { if (!(saldo(f) > 0)) return false; }

    if (q) {

      if (!hay.includes(q) && !(qd.length >= 3 && digits(c.rnc).includes(qd))) return false;

/* =========================================================
   FACTURACIÓN ELECTRÓNICA (e-CF) — la firma y el envío ocurren en el Worker (/api/ecf/*)
   ========================================================= */
const AMBIENTES_ECF = { testecf: 'Pre-certificación (TesteCF)', certecf: 'Certificación (CerteCF)', ecf: 'Producción' };
const PILL_ECF = { 'Aceptado': 'green', 'Aceptado Condicional': 'green', 'Rechazado': 'red', 'En Proceso': 'amber', 'No encontrado': 'gray' };
async function apiECF(ruta, body) {
  const { data } = await sb.auth.getSession();
  let r;
  try {
    r = await fetch('/api/ecf/' + ruta, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (data.session?.access_token || '') }, body: JSON.stringify(body) });
  } catch (e) { throw new Error('Sin conexión con el servidor.'); }
  if (!(r.headers.get('content-type') || '').includes('json')) throw new Error('La facturación electrónica solo funciona en la app publicada.');
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'Error desconocido');
  return d;
}
function cargarScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}
function tarjetaECF(f) {
  const x = f.ecf || {};

  return `<div class="card mt"><div class="card-h">Facturación electrónica · DGII<span class="sp"></span>
      ${x.estado ? `<span class="pill ${PILL_ECF[x.estado] || 'gray'}">${esc(x.estado)}</span>` : '<span class="pill gray">Sin enviar</span>'}</div>
    <div class="card-b">
      ${x.error ? `<div class="alert err mb">${esc(x.error)}</div>` : ''}
      ${x.estado === 'Rechazado' ? `<div class="alert err mb">La DGII rechazó este comprobante. ${x.secuenciaUtilizada ? 'El e-NCF quedó utilizado: anula este documento y emite uno nuevo.' : 'Puedes corregir los datos y reenviarlo con el mismo e-NCF.'}</div>` : ''}
      ${(x.mensajes || []).length ? `<div class="alert ${x.estado === 'Rechazado' ? 'err' : 'warn'} mb"><div>${x.mensajes.map(m => '• ' + esc(m)).join('<br>')}</div></div>` : ''}
      <dl class="kv" style="margin:0">
        <dt>e-NCF</dt><dd class="mono">${esc(f.ncf)}</dd>
        ${x.ambiente ? `<dt>Ambiente</dt><dd>${esc(AMBIENTES_ECF[x.ambiente] || x.ambiente)}</dd>` : ''}
        ${x.rfce ? `<dt>Envío</dt><dd>Resumen de factura de consumo (RFCE)</dd>` : ''}
        ${x.trackId ? `<dt>TrackId</dt><dd class="mono small">${esc(x.trackId)}</dd>` : ''}
        ${x.codigoSeguridad ? `<dt>Código de seguridad</dt><dd class="mono">${esc(x.codigoSeguridad)}</dd>` : ''}
        ${x.fechaFirma ? `<dt>Fecha de firma</dt><dd>${esc(x.fechaFirma)}</dd>` : ''}
      </dl>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        ${puedeEnviar ? `<button class="btn primary" onclick="A.enviarECF('${f.id}')">${icon('receipt')} ${x.estado ? 'Reenviar' : 'Enviar'} a la DGII</button>` : ''}
        ${x.trackId && x.estado !== 'Aceptado' ? `<button class="btn" onclick="A.consultarECF('${f.id}')">${icon('search')} Consultar estado</button>` : ''}
        ${x.xml ? `<button class="btn" onclick="A.descargarXML('${f.id}')">${icon('down')} XML firmado</button>` : ''}
        ${x.qr ? `<a class="btn" href="${esc(x.qr)}" target="_blank" rel="noopener">Ver en DGII</a>` : ''}
      </div>
    </div></div>`;
}

      <span class="hint">Usa Pre-certificación para pruebas. Producción solo cuando la DGII te autorice.</span></div>

    <div class="fgrid">
      <div class="field"><label>Archivo .p12 / .pfx ${cfg?.cert_info?.cn ? '(para reemplazar)' : ''}</label><input type="file" name="p12" accept=".p12,.pfx,application/x-pkcs12"></div>
      <div class="field"><label>Contraseña del certificado</label><input class="in" type="password" name="pass" autocomplete="off"><span class="hint">Se usa solo en este navegador para abrir el archivo; no se guarda.</span></div>
    </div>
    ${cfg?.cert_info?.cn ? `<div class="section-title">Firmar un XML de la DGII</div>
    <p class="small muted" style="margin:0 0 8px">Para los archivos que la DGII te pide firmar (por ejemplo, en la postulación). Se firma con el certificado de esta empresa y se descarga con el mismo nombre.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="file" id="xml-a-firmar" accept=".xml,text/xml">
      <button type="button" class="btn" onclick="A.firmarXML('${eid}')">${icon('edit')} Firmar y descargar</button></div>` : ''}
    <div class="section-title">3. Secuencias e-NCF</div>
    <p class="small" style="margin:0">${seqE.length ? 'Activas: ' + seqE.map(t => `<span class="tag">${t}</span>`).join(' ') : 'No hay secuencias e-NCF activas.'} Configúralas en <b>Empresas → Editar → Secuencias</b> (E31, E32, E34, E44, E45).</p>`, {
    wide: true, okText: 'Guardar', onOk: async form => {
      const ambiente = fv(form, 'ambiente');
      const file = form.elements.p12.files[0];
      const body = { empresaId: eid, ambiente };
      if (ambiente === 'ecf' && cfg?.ambiente !== 'ecf' && !confirm('¿Pasar a PRODUCCIÓN? Los comprobantes enviados tendrán validez fiscal.')) return false;
      if (file) {
        const pass = form.elements.pass.value;
        await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js');
        let p12;
        try {
          const bin = forge.util.binary.raw.encode(new Uint8Array(await file.arrayBuffer()));
          p12 = forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin), false, pass);
        } catch (err) { toast('No se pudo abrir el certificado: contraseña incorrecta o archivo no válido.', 'error'); return false; }
        const keyBag = (p12.getBags({ bagType: forge.pki.oids.pkcs8ShroudedKeyBag })[forge.pki.oids.pkcs8ShroudedKeyBag] || [])[0]
          || (p12.getBags({ bagType: forge.pki.oids.keyBag })[forge.pki.oids.keyBag] || [])[0];
        const certs = (p12.getBags({ bagType: forge.pki.oids.certBag })[forge.pki.oids.certBag] || []).map(b => b.cert).filter(Boolean);
        if (!keyBag || !certs.length) { toast('El archivo no contiene una clave privada y un certificado.', 'error'); return false; }
        const key = keyBag.key;
        const cert = certs.find(c => c.publicKey.n && c.publicKey.n.equals(key.n));
        if (!cert) { toast('El certificado no corresponde a la clave privada del archivo.', 'error'); return false; }
        const attr = n => (cert.subject.getField(n) || cert.subject.getField({ name: n }) || {}).value || '';
        const certInfo = {
          cn: attr('CN'), sn: attr('serialNumber'), emisor: (cert.issuer.getField('CN') || cert.issuer.getField('O') || {}).value || '',
          validFrom: cert.validity.notBefore.toISOString(), validTo: cert.validity.notAfter.toISOString(), serial: cert.serialNumber,
        };
        if (cert.validity.notAfter < new Date()) { toast('El certificado está vencido.', 'error'); return false; }
        Object.assign(body, {
          pkcs8: forge.util.encode64(forge.asn1.toDer(forge.pki.wrapRsaPrivateKey(forge.pki.privateKeyToAsn1(key))).getBytes()),
          cert: forge.util.encode64(forge.asn1.toDer(forge.pki.certificateToAsn1(cert)).getBytes()),
          info: certInfo,
        });
      }
      await apiECF('certificado', body);
      toast(file ? 'Certificado guardado' : 'Configuración guardada', 'ok');
    }
  });
};

/* =========================================================

   ========================================================= */
const certKey = () => 'cert_set_' + DB.activeId;
let CERT = null;
function certCargar() {
  if (CERT && CERT.empresaId === DB.activeId) return CERT;
  try { CERT = JSON.parse(localStorage.getItem(certKey())) || null; } catch (e) { CERT = null; }
  if (!CERT || CERT.empresaId !== DB.activeId) CERT = { empresaId: DB.activeId, archivo: '', ambiente: 'certecf', ECF: [], RFCE: [], res: {} };
  return CERT;
}
function certGuardar() { try { localStorage.setItem(certKey(), JSON.stringify(CERT)); } catch (e) { } }

const certOkA = r => r && (String(r.codigo) === '1' || /aprobada|aceptad/i.test(r.estado || ''));
async function certProcesarA(a) {
  const C = certCargar();
  C.resA = C.resA || {};
  try {
    const r = await apiECF('set', { empresaId: DB.activeId, ambiente: C.ambiente, accion: 'acecf', fila: a });
    C.resA[a.eNCF] = { xml: r.xml, codigo: r.codigo, estado: r.estado, mensajes: r.mensajes };
  } catch (err) { C.resA[a.eNCF] = { ...(C.resA[a.eNCF] || {}), error: errMsg(err) }; }

}
A.certFilaA = async encf => {
  busy(true, 'Enviando aprobación ' + encf + '…');
  try { await certProcesarA(certCargar().ACECF.find(a => a.eNCF === encf)); } finally { busy(false); route(true); }
};
A.certTodoA = async () => {
  const C = certCargar();
  const pend = C.ACECF.filter(a => !certOkA((C.resA || {})[a.eNCF]));
  if (!pend.length) return toast('No hay aprobaciones pendientes.');
  for (let i = 0; i < pend.length; i++) { busy(true, `Enviando aprobación ${i + 1} de ${pend.length}…`); await certProcesarA(pend[i]); }
  busy(false); route(true);
  const fallos = pend.filter(a => !certOkA(C.resA[a.eNCF])).length;
  toast(fallos ? `${fallos} aprobaciones con error o rechazo. Revisa el detalle.` : 'Todas las aprobaciones fueron aceptadas.', fallos ? 'error' : 'ok');
};
A.certXMLA = encf => {

A.certArchivo = async input => {
  const file = input.files[0]; if (!file) return;
  busy(true, 'Leyendo el set de pruebas…');
  try {
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const hoja = n => {
      const ws = wb.Sheets[n]; if (!ws) return [];
      return XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' }).map(fila => {
        const o = {}; for (const [k, val] of Object.entries(fila)) { const s = String(val).trim(); if (s && s !== '#e') o[k.trim()] = s; }
        return o;
      }).filter(o => o.ENCF);
    };
    const C = certCargar();
    // Set de aprobaciones comerciales (Paso 3): hoja con la columna FechaHoraAprobacionComercial
    const hojaAprob = wb.SheetNames.find(n => {
      const ws = wb.Sheets[n]; const fila1 = ws && XLSX.utils.sheet_to_json(ws, { header: 1, range: 0 })[0];
      return Array.isArray(fila1) && fila1.some(h => String(h).trim() === 'FechaHoraAprobacionComercial');
    });
    if (hojaAprob) {
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[hojaAprob], { raw: false, defval: '' }).map(fila => {
        const o = {}; for (const [k, val] of Object.entries(fila)) { const s = String(val).trim(); if (s && s !== '#e') o[k.trim()] = s; }
        return o;
      }).filter(o => o.eNCF);
      if (C.ACECF?.length && Object.keys(C.resA || {}).length && !confirm('Ya hay aprobaciones cargadas con resultados. ¿Reemplazarlas?')) return;
      Object.assign(C, { archivoA: file.name, ACECF: filas, resA: {} });
      certGuardar(); toast(`Aprobaciones comerciales cargadas: ${filas.length}`, 'ok');
      return;
    }
    if (C.ECF.length && Object.keys(C.res).length && !confirm('Ya hay un set cargado con resultados. ¿Reemplazarlo?')) return;
    Object.assign(C, { archivo: file.name, ECF: hoja('ECF'), RFCE: hoja('RFCE'), res: {} });
    if (!C.ECF.length) throw new Error('El archivo no tiene la hoja "ECF" (comprobantes) ni una hoja de aprobaciones comerciales.');
    certGuardar(); toast(`Set cargado: ${C.ECF.length} comprobantes y ${C.RFCE.length} resúmenes`, 'ok');
  } catch (err) { toast(errMsg(err), 'error'); }
  finally { busy(false); input.value = ''; route(true); }
};
async function certProcesar(f) {
  const C = certCargar(), base = { empresaId: DB.activeId, ambiente: C.ambiente };
  try {
    if (certEsRfce(f)) {
      const rf = C.RFCE.find(r => r.ENCF === f.ENCF);
      if (!rf) throw new Error('No hay fila RFCE para ' + f.ENCF);
      // Si ya se firmó el e-CF completo, se reutiliza para que el código de seguridad coincida con el XML que se sube al portal.
      const previo = C.res[f.ENCF] || {};
      const firmado = previo.xml && previo.codigoSeguridad ? previo : await apiECF('set', { ...base, accion: 'firmar', fila: f });
      C.res[f.ENCF] = { xml: firmado.xml, codigoSeguridad: firmado.codigoSeguridad, fechaFirma: firmado.fechaFirma };
      certGuardar();
      const r = await apiECF('set', { ...base, accion: 'rfce', fila: rf, codigoSeguridad: firmado.codigoSeguridad });
      C.res[f.ENCF] = { ...C.res[f.ENCF], estado: r.estado, codigo: r.codigo, mensajes: r.mensajes, secuenciaUtilizada: r.secuenciaUtilizada, rfce: true };
    } else {
      const r = await apiECF('set', { ...base, accion: 'ecf', fila: f });
      C.res[f.ENCF] = { xml: r.xml, codigoSeguridad: r.codigoSeguridad, trackId: r.trackId, estado: r.estado, codigo: r.codigo, mensajes: r.mensajes };
    }
  } catch (err) {
    C.res[f.ENCF] = { ...(C.res[f.ENCF] || {}), error: errMsg(err), estado: (C.res[f.ENCF] || {}).estado };
  }
  certGuardar();
}
A.certFila = async encf => {
  const f = certCargar().ECF.find(x => x.ENCF === encf);
  busy(true, 'Enviando ' + encf + '…');
  try { await certProcesar(f); } finally { busy(false); route(true); }
};
A.certTodo = async () => {
  const C = certCargar();
  const pend = [...C.ECF].sort((a, b) => certOrden(a) - certOrden(b)).filter(f => !certOk(C.res[f.ENCF]) && (C.res[f.ENCF] || {}).estado !== 'En Proceso');
  if (!pend.length) return toast('No hay comprobantes pendientes.');
  for (let i = 0; i < pend.length; i++) {
    busy(true, `Enviando ${i + 1} de ${pend.length}: ${pend[i].ENCF}…`);
    await certProcesar(pend[i]);
  }
  busy(false); route(true);
  const fallos = pend.filter(f => !certOk(C.res[f.ENCF])).length;
  toast(fallos ? `Terminado con ${fallos} pendientes o rechazados. Revisa el detalle.` : 'Todos los comprobantes fueron aceptados.', fallos ? 'error' : 'ok');
};
A.certConsultar = async encf => {
  const C = certCargar(), r = C.res[encf];
  busy(true, 'Consultando ' + encf + '…');
  try {
    const q = await apiECF('set', { empresaId: DB.activeId, ambiente: C.ambiente, accion: 'consultar', trackId: r.trackId });
    Object.assign(r, { estado: q.estado, codigo: q.codigo, mensajes: q.mensajes, error: '' });
    certGuardar();
  } catch (err) { toast(errMsg(err), 'error'); }
  finally { busy(false); route(true); }
};
A.certXML = encf => {
  const C = certCargar(), f = C.ECF.find(x => x.ENCF === encf), r = C.res[encf];
  download(`${f.RNCEmisor}${encf}.xml`, r.xml, 'text/xml');

A.certDescargarFC = () => {
  const C = certCargar();
  const lista = C.ECF.filter(f => certEsRfce(f) && C.res[f.ENCF]?.xml);
  if (!lista.length) return toast('Primero envía los resúmenes de consumo (RFCE).', 'error');

A.certLimpiar = () => confirmar('Quitar set de pruebas', 'Se borrarán de este navegador el set cargado y sus resultados. ¿Continuar?', () => {

function itemRow(it, i) {

  return `<tr>

      ${it.sku ? `<span class="sub">SKU: ${esc(it.sku)}</span>` : ''}</td>
    <td><input class="in num" type="number" step="any" min="0" value="${it.cantidad}" oninput="A.di(${i},'cantidad',this.value)"></td>
    <td><input class="in num" type="number" step="0.01" min="0" value="${it.precio}" oninput="A.di(${i},'precio',this.value)"></td>
    <td><input class="in num" type="number" step="any" min="0" max="100" value="${it.descuento || 0}" oninput="A.di(${i},'descuento',this.value)"></td>
    <td><select class="in" onchange="A.di(${i},'itbis',+this.value)">${ITBIS_TASAS.map(t => `<option value="${t}" ${num(it.itbis) === t ? 'selected' : ''}>${t ? t + '%' : 'Exento'}</option>`).join('')}</select></td>
    <td class="right mono" id="li-${i}">${money(base)}</td>
    <td><button type="button" class="icon-btn" title="Quitar" onclick="A.delItem(${i})">${icon('trash')}</button></td></tr>`;
}
A.df = (k, val, rerender) => { draft[k] = val; if (rerender) renderForm(); };
A.di = (i, k, val) => {
  draft.items[i][k] = k === 'descripcion' ? val : val;
  const it = draft.items[i], b = r2(num(it.cantidad) * num(it.precio));
  const cell = $('#li-' + i); if (cell) cell.textContent = money(r2(b - b * num(it.descuento) / 100));

A.pickProd = (i, val) => {

  if (!p) return;

};

A.delItem = i => {

A.guardarFactura = async () => {
  const e = emp(), d = draft;
  const items = d.items.filter(it => String(it.descripcion).trim() && num(it.cantidad) > 0)
    .map(it => ({ productoId: it.productoId || '', sku: it.sku || '', descripcion: String(it.descripcion).trim(), cantidad: r2(num(it.cantidad)), precio: r2(num(it.precio)), descuento: Math.min(100, Math.max(0, num(it.descuento))), itbis: num(it.itbis), tipo: it.tipo || (getP(it.productoId)?.tipo) || 'bien' }));
  if (!items.length) return toast('Agrega al menos un ítem con descripción y cantidad.', 'error');
  if (items.some(it => it.precio < 0)) return toast('Los precios no pueden ser negativos.', 'error');
  const cli = d.clienteId ? getC(d.clienteId) : null;
  if (NCF_TIPOS[d.tipo]?.requiereRNC && !(cli && validId(cli.rnc)))
    return toast(`El comprobante ${d.tipo} requiere un cliente con RNC (9 dígitos) o cédula (11 dígitos).`, 'error');
  const total = calc({ items, propina: d.propina }).total;
  if (total <= 0) return toast('El total debe ser mayor que cero.', 'error');
  if (d.tipo === 'E32' && total >= LIMITE_RFCE && !(cli && validId(cli.rnc)))
    return toast('Las facturas de consumo electrónicas de RD$250,000 o más requieren un cliente con RNC o cédula.', 'error');
  if (d.tipo === 'E44' && items.some(it => num(it.itbis) !== 0))
    return toast('El e-CF de Régimen Especial (E44) solo admite ítems exentos de ITBIS.', 'error');
  if (esECF(d.tipo) && !emp().direccion) return toast('Para emitir e-CF, completa la dirección de la empresa en Empresas → Editar.', 'error');
  if (esNota(d.tipo)) {
    const o = getF(d.facturaAfectadaId);
    if (!o) return toast('Selecciona la factura que afecta la nota de crédito.', 'error');
    const otras = notasDe(o).filter(n => n.id !== d.id).reduce((s, n) => s + calc(n).total, 0);
    const disponible = r2(calc(o).total - otras);
    if (total > disponible + 0.004) return toast(`La nota de crédito no puede exceder ${money(disponible)} (total de la factura menos otras notas).`, 'error');
  }
  if (A._saving) return;
  const campos = {
    clienteId: cli ? cli.id : '',
    cliente: cli ? { nombre: cli.nombre, rnc: cli.rnc, direccion: cli.direccion, telefono: cli.telefono, email: cli.email } : { nombre: 'Consumidor Final' },
    fecha: d.fecha || today(),
    condicion: esNota(d.tipo) ? 'contado' : d.condicion,
    diasCredito: d.condicion === 'credito' ? num(d.diasCredito) : 0,
    vencimiento: !esNota(d.tipo) && d.condicion === 'credito' ? addDays(d.fecha || today(), d.diasCredito) : '',
    items, propina: !!d.propina, notas: d.notas || '',
    facturaAfectadaId: esNota(d.tipo) ? d.facturaAfectadaId : '',
  };
  A._saving = true; busy(true, d._edit ? 'Guardando…' : 'Emitiendo comprobante…');
  try {
    let f;
    if (d._edit) {
      f = await mutateFactura(d.id, x => {
        if ((x.pagos || []).length || x.estado === 'anulada') throw new Error('La factura ya tiene pagos o fue anulada; no se puede editar.');
        Object.assign(x, campos);
      });
    } else {
      const data = { ...campos, creada: new Date().toISOString(), creadaPor: SESSION.user.email, pagos: [], estado: 'emitida' };
      if (d.pagarAhora && !esNota(d.tipo)) data.pagos.push({ id: uid(), fecha: data.fecha, metodo: d.metodoPago || 'Efectivo', monto: calc(data).total, referencia: '', por: SESSION.user.email });
      const row = chk(await sb.rpc('emitir_factura', { p_empresa: e.id, p_tipo: d.tipo, p_data: data }));
      f = fromFacturaRow(row);
      putCache('facturas', f);
      reloadEmpresa(e.id).catch(() => { });
    }
    toast(d._edit ? 'Cambios guardados' : `${f.numero} emitida${f.ncf ? ' · NCF ' + f.ncf : ''}`, 'ok');
    draft = null;
    location.hash = '#/facturas/' + f.id;
    if (!d._edit && esECF(f.tipo)) setTimeout(() => A.enviarECF(f.id), 60);
  } catch (err) { console.error(err); toast(errMsg(err), 'error'); }
  finally { A._saving = false; busy(false); }
};

/* ---------- Consulta de RNC en la DGII (vía /api/rnc del Worker) ---------- */
const rncCache = {};
function rncField(valor, ctx, estado = '') {
  return `<div class="field" style="grid-column:1/-1"><label>RNC o cédula</label>
    <div style="display:flex;gap:8px"><input class="in" name="rnc" value="${esc(fmtId(valor))}" placeholder="131-00000-1" inputmode="numeric"
      oninput="A.rncAuto(this,'${ctx}')" onkeydown="if(event.key==='Enter'){event.preventDefault();A.buscarRNC(this.form,'${ctx}')}">
      <button type="button" class="btn" onclick="A.buscarRNC(this.form,'${ctx}')">${icon('search')} Buscar en DGII</button></div>
    <input type="hidden" name="estadoDGII" value="${esc(estado)}">
    <span class="hint rnc-info">Escribe el RNC (9 dígitos) o la cédula (11) y se completan los datos desde la DGII.</span></div>`;
}
async function consultarRNC(rnc) {
  rnc = digits(rnc);
  if (rncCache[rnc]) return rncCache[rnc];
  let r;
  try { r = await fetch('/api/rnc?rnc=' + rnc); } catch (e) { throw new Error('Sin conexión para consultar la DGII.'); }
  const tipo = r.headers.get('content-type') || '';
  if (!tipo.includes('application/json')) throw new Error('La consulta a la DGII solo funciona en la app publicada.');
  const d = await r.json();
  if (d.ok) rncCache[rnc] = d;
  return d;
}
let rncTimer = null;
A.rncAuto = (input, ctx) => {
  clearTimeout(rncTimer);
  const d = digits(input.value);
  if (d.length === 9 || d.length === 11) rncTimer = setTimeout(() => { if (input.form.dataset.rncBuscado !== d) A.buscarRNC(input.form, ctx); }, 350);
};
A.buscarRNC = async (form, ctx) => {
  const rnc = digits(form.elements.rnc.value);
  const info = form.querySelector('.rnc-info');
  const set = (n, v) => { if (form.elements[n] && v) form.elements[n].value = v; };
  if (!validId(rnc)) { info.innerHTML = '<span style="color:var(--red)">El RNC debe tener 9 dígitos o la cédula 11.</span>'; return; }
  form.dataset.rncBuscado = rnc;
  info.innerHTML = 'Consultando DGII…';
  try {
    const d = await consultarRNC(rnc);
    if (digits(form.elements.rnc.value) !== rnc) return;
    if (!d.ok) { info.innerHTML = `<span style="color:var(--amber)">${esc(d.error)}</span>`; return; }
    form.elements.rnc.value = fmtId(rnc);
    if (ctx === 'empresa') {
      set('nombre', d.nombreComercial || d.razonSocial);
      set('razonSocial', d.razonSocial);
    } else {
      set('nombre', d.razonSocial);
      set('nombreComercial', d.nombreComercial);
    }
    set('actividad', d.actividad);
    set('estadoDGII', d.estado);
    const activo = (d.estado || '').toUpperCase() === 'ACTIVO';
    info.innerHTML = `<span style="color:${activo ? 'var(--green)' : 'var(--red)'};font-weight:600">${activo ? '✓' : '⚠'} DGII: ${esc(d.estado || '—')}</span>`
      + ` · Régimen ${esc(d.regimen || '—')}${d.facturadorElectronico ? ` · Facturador electrónico: ${esc(d.facturadorElectronico)}` : ''}`
      + (activo ? '' : ' · <b>Este contribuyente no está activo.</b>');
  } catch (err) { info.innerHTML = `<span style="color:var(--red)">${esc(err.message)}</span>`; }
};

// Crea empresas nuevas a partir de un respaldo (ids nuevos, referencias re-mapeadas).
async function importarDatos(src) {
  busy(true, 'Importando…');
  let ultima = null;
  try {
    for (const e of src.empresas) {
      busy(true, `Importando ${e.nombre}…`);
      const { id: oldId, proximoNumero, proximoNC, secuencias, rol, ...resto } = e;
      const eid = chk(await sb.rpc('crear_empresa', { p_nombre: e.nombre, p_data: resto }));
      ultima = eid;
      chk(await sb.from('empresas').update({ proximo_numero: num(proximoNumero) || 1, proximo_nc: num(proximoNC) || 1 }).eq('id', eid));
      chk(await sb.from('secuencias').upsert(seqRows(eid, secuencias || {}), { onConflict: 'empresa_id,tipo' }));
      const mapC = {}, mapP = {}, mapF = {};
      const cs = (src.clientes || []).filter(c => !c.empresaId || c.empresaId === oldId);
      const ps = (src.productos || []).filter(p => !p.empresaId || p.empresaId === oldId);
      const fs = (src.facturas || []).filter(f => !f.empresaId || f.empresaId === oldId);
      cs.forEach(c => mapC[c.id] = uid()); ps.forEach(p => mapP[p.id] = uid()); fs.forEach(f => mapF[f.id] = uid());
      const insert = async (table, rows) => { for (let i = 0; i < rows.length; i += 300) chk(await sb.from(table).insert(rows.slice(i, i + 300))); };
      await insert('clientes', cs.map(c => ({ id: mapC[c.id], empresa_id: eid, data: stripIds(c) })));
      await insert('productos', ps.map(p => ({ id: mapP[p.id], empresa_id: eid, data: stripIds(p) })));
      await insert('facturas', fs.map(f => {
        const { _v, ...rest } = stripIds(f);
        const data = { ...rest, clienteId: mapC[f.clienteId] || '', facturaAfectadaId: mapF[f.facturaAfectadaId] || '', items: (f.items || []).map(it => ({ ...it, productoId: mapP[it.productoId] || '' })) };
        return { id: mapF[f.id], empresa_id: eid, numero: f.numero, tipo: f.tipo, ncf: f.ncf || null, fecha: f.fecha, data };
      }));
    }
    await loadEmpresas();
    if (ultima) await activarEmpresa(ultima);
    toast('Importación completada', 'ok');
    location.hash = '#/dashboard'; route();
  } catch (err) {
    console.error(err); toast('Error al importar: ' + errMsg(err), 'error');
    try { await loadEmpresas(); if (!emp()) await activarEmpresa(DB.empresas[0]?.id || null); } catch (e) { }
    route();
  } finally { busy(false); }
}

// Código QR (versión 8 como pide la DGII; si el contenido no cabe, versión automática)
function qrSVG(texto) {
  if (typeof qrcode === 'undefined' || !texto) return '';
  for (const version of [8, 0]) {
    try { const qr = qrcode(version, 'L'); qr.addData(texto); qr.make(); return qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true }); } catch (e) { }
  }
  return '';
}
function bloqueECF(f, ticket) {
  const x = f.ecf || {};
  if (!esECF(f.tipo) || !x.codigoSeguridad) return '';
  return `<div class="${ticket ? 'tk' : 'p-ecf'}">

    <div class="small">Código de Seguridad: <b>${esc(x.codigoSeguridad)}</b><br>Fecha de Firma Digital: ${esc(x.fechaFirma || '')}</div>

A.cargarEjemplo = () => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const y = new Date().getFullYear();
  const e = {
    id: uid(), creada: new Date().toISOString(), nombre: 'Taller Demo SRL', razonSocial: 'Taller Demo, S.R.L.', rnc: '101000001',
    telefono: '(809) 555-0100', email: 'info@tallerdemo.do', web: '', direccion: 'Av. Ejemplo #10, Santiago', logo: '',
    prefijo: 'INV', proximoNumero: 1, proximoNC: 1, tipoPredeterminado: 'B02', condicionPredeterminada: 'contado', itbisPredeterminado: 18,
    notaPie: 'Gracias por preferirnos. Garantía de 30 días en mano de obra.',
    secuencias: {
      B01: { activo: true, desde: 1, hasta: 500, actual: 0, vence: `${y + 1}-12-31` },
      B02: { activo: true, desde: 1, hasta: 2000, actual: 0, vence: `${y + 1}-12-31` },
      B14: { activo: false, desde: 1, hasta: '', actual: 0, vence: `${y + 1}-12-31` },
      B15: { activo: true, desde: 1, hasta: 50, actual: 0, vence: `${y + 1}-12-31` },
      B04: { activo: true, desde: 1, hasta: 100, actual: 0, vence: `${y + 1}-12-31` },
    },
  };
  const cls = [
    ['Constructora Ejemplo SRL', '130000011', '(809) 555-0111', 'Calle 1 #5, Santiago'],
    ['Inversiones Demo SAS', '131000022', '(809) 555-0122', 'Av. Principal 22, Santo Domingo'],
    ['Juan Pérez (demo)', '00100000001', '(829) 555-0133', 'Los Jardines, Santiago'],
    ['Ferretería Modelo SRL', '132000033', '(809) 555-0144', 'Carretera Duarte km 5'],
    ['Ayuntamiento Demo', '401000044', '(809) 555-0155', 'Parque Central'],
  ].map(([nombre, rnc, telefono, direccion]) => ({ id: uid(), empresaId: e.id, creado: new Date().toISOString(), nombre, rnc, telefono, email: '', direccion, notas: '' }));
  const prods = [
    ['00976', 'Aceite de motor 1/4', 'bien', 500, 18], ['00502', 'Filtro de aire', 'bien', 1000, 18], ['087295', 'Bujía NGK', 'bien', 300, 18],
    ['01015', 'Mano de obra', 'servicio', 550, 18], ['01426', 'Limpieza de tanque', 'servicio', 500, 18], ['02001', 'Diagnóstico general', 'servicio', 1500, 18],
    ['03003', 'Manguera de gasolina', 'bien', 150, 18], ['04004', 'Carburador completo', 'bien', 3200, 18],
  ].map(([sku, descripcion, tipo, precio, itbis]) => ({ id: uid(), empresaId: e.id, sku, descripcion, tipo, precio, itbis }));
  const fechas = []; for (let i = 0; i < 46; i++) fechas.push(addDays(today(), -Math.floor(rnd() * 330)));
  fechas.sort();
  const nuevas = [];
  fechas.forEach((fecha, i) => {
    const cli = rnd() < 0.4 ? null : pick(cls);
    const tipo = !cli ? 'B02' : cli.rnc.startsWith('4') ? 'B15' : 'B01';
    const n = 1 + Math.floor(rnd() * 3);
    const items = []; for (let k = 0; k < n; k++) { const p = pick(prods); items.push({ productoId: p.id, sku: p.sku, descripcion: p.descripcion, cantidad: 1 + Math.floor(rnd() * 3), precio: p.precio, descuento: 0, itbis: p.itbis }); }
    const credito = !!cli && rnd() < 0.5;
    const s = e.secuencias[tipo]; s.actual++;
    const f = {
      id: uid(), empresaId: e.id, creada: new Date(fecha + 'T10:00:00').toISOString(), estado: 'emitida', tipo,
      ncf: tipo + pad(s.actual, 8), ncfVence: s.vence, numero: `INV-${pad(e.proximoNumero++)}`,
      clienteId: cli ? cli.id : '', cliente: cli ? { nombre: cli.nombre, rnc: cli.rnc, direccion: cli.direccion, telefono: cli.telefono, email: '' } : { nombre: 'Consumidor Final' },
      fecha, condicion: credito ? 'credito' : 'contado', diasCredito: credito ? 30 : 0, vencimiento: credito ? addDays(fecha, 30) : '',
      items, propina: false, notas: e.notaPie, facturaAfectadaId: '', pagos: [],
    };
    const tot = calc(f).total;
    const edad = daysBetween(fecha, today());
    if (!credito) f.pagos.push({ id: uid(), fecha, metodo: pick(['Efectivo', 'Tarjeta', 'Efectivo', 'Transferencia']), monto: tot, referencia: '' });
    else if (edad > 40 && rnd() < 0.8) f.pagos.push({ id: uid(), fecha: addDays(fecha, 20 + Math.floor(rnd() * 15)), metodo: 'Transferencia', monto: tot, referencia: '' });
    else if (rnd() < 0.3) f.pagos.push({ id: uid(), fecha: addDays(fecha, 5), metodo: 'Cheque', monto: r2(tot / 2), referencia: '' });
    if (i === 12) { f.estado = 'anulada'; f.pagos = []; f.anulada = { fecha, motivo: '04' }; }
    nuevas.push(f);
  });
  return importarDatos({ empresas: [e], clientes: cls, productos: prods, facturas: nuevas });
};

/* ---------- Start ---------- */
async function boot(session) {
  SESSION = session;
  BOOTING = true; route();
  try {
    await sb.rpc('aceptar_invitaciones');
    await loadEmpresas();
    let id = null;
    try { id = localStorage.getItem(activeKey()); } catch (e) { }
    if (!DB.empresas.some(e => e.id === id)) id = DB.empresas[0]?.id || null;
    await activarEmpresa(id);
  } catch (err) {
    console.error(err);
    BOOTING = false;
    document.body.classList.add('auth-mode');
    $('#view').innerHTML = `<div class="auth-wrap"><div class="card auth-card"><div class="alert err">${esc(errMsg(err))}</div>
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="location.reload()">Reintentar</button><button class="btn" onclick="A.logout()">Cerrar sesión</button></div></div></div>`;
    return;
  }
  BOOTING = false; route();
}
let bootedFor = null;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') setTimeout(pedirNuevaPassword, 300);
  if (event === 'INITIAL_SESSION' && !session) { BOOTING = false; route(); return; }
  const prev = SESSION?.user?.id, next = session?.user?.id;
  if (next && next !== bootedFor) { bootedFor = next; setTimeout(() => boot(session), 0); return; }
  if (!next && prev) {
    SESSION = null; DB = blankDB(); bootedFor = null;
    if (channel) { sb.removeChannel(channel); channel = null; }
    authMode = 'login'; route(); return;
  }
  if (session) SESSION = session;
});
